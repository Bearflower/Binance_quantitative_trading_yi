name: Scoped MTPCS digest windows
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mtpcs-entry-intent-production
  cancel-in-progress: false
jobs:
  activate:
    if: github.ref == 'refs/heads/codex/mtpcs-digest-windows-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test the MTPCS report
        run: |
          python -m pip install pytest==8.0.0
          python -m pytest -q tests/test_ai_tuner_mvp/test_mtpcs_digest_windows.py
          bash -n deployment/mtpcs-digest-windows/activate.sh
      - name: Deploy and verify the MTPCS section
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' '43.156.242.184 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFNCPR4nqDmkewu2141YjcAEiP/PD+cBEXMZKWDcAlSu' > ~/.ssh/known_hosts
          localdir=$(mktemp -d)
          cp ai_tuner/ops/{mtpcs_observation,mtpcs_shadow_summary}.py deployment/mtpcs-digest-windows/activate.sh \
             scripts/database_permissions.py database/postgres/permissions.json "$localdir/"
          (cd "$localdir"; sha256sum *.py *.sh permissions.json > files.sha256)
          remote=root@43.156.242.184
          folder="/root/trading_system/.releases/mtpcs-digest-windows/$GITHUB_SHA"
          ssh "$remote" "install -d -m 700 '$folder'"
          scp "$localdir"/* "$remote:$folder/"
          ssh "$remote" "bash '$folder/activate.sh' '$GITHUB_SHA'"
