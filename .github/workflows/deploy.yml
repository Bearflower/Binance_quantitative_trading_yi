name: CI/CD — 构建镜像并自动部署

# ============================================
# Binance 量化交易系统 CI/CD 流水线（智能增量构建 v3）
#
# 改了啥 → 只构建啥：
#   shared/** 改了 → 全部 10 个重建
#   只改某个策略目录 → 只构建那个
#
# 原理：
#   detect job 先跑 git diff 看有哪些路径变了
#   静态 10 个 build job → 每个开头 git diff 自己判断要不要 build
#   服务器 deploy → docker compose pull/up 本身就是增量的
# ============================================

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'backtest/**'
      - 'tests/**'
      - '.trae/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: bearflower

jobs:
  # ============================================
  # Job 0: 路径过滤（纯诊断，不参与矩阵展开）
  # ============================================
  detect:
    name: 🔍 检测变更
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔍 路径过滤
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # 输出 changed_files = 变更文件列表
          filters: |
            changes:
              - '!docs/**'
              - '!backtest/**'
              - '!tests/**'
              - '!.trae/**'
              - '!*.md'

      - name: 📋 输出变更文件清单
        run: |
          echo "=== 本次 commit (${{ github.sha }}) 改动 ==="
          echo "Commit message: $(printf '%s' '${{ github.event.head_commit.message }}' | tr '\n' ' ')"
          echo ""
          echo "检测到变更（自动过滤 docs/backtest/tests/.trae/*.md）"

  # ============================================
  # Job 1: 静态 10 个矩阵并行
  # 每个 job 用 git diff HEAD~1 HEAD 判断：
  #   shared/** 改了 → 构建
  #   自己的目录改了 → 构建
  #   否则 → skip（秒级 exit 0）
  # ============================================
  build-all:
    name: 🛠️ ${{ matrix.service.name }}
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: "btc-eth",        dir: "strategies/btc_eth",              dockerfile: "strategies/btc_eth/Dockerfile" }
          - { name: "btc-eth-aggr",   dir: "strategies/btc_eth_aggressive",   dockerfile: "strategies/btc_eth_aggressive/Dockerfile" }
          - { name: "new-coin",       dir: "strategies/new_coin",             dockerfile: "strategies/new_coin/Dockerfile" }
          - { name: "grid",           dir: "strategies/grid",                 dockerfile: "strategies/grid/Dockerfile" }
          - { name: "hrs",            dir: "strategies/hrs",                  dockerfile: "strategies/hrs/Dockerfile" }
          - { name: "kline-service",  dir: "services/kline_service",          dockerfile: "services/kline_service/Dockerfile" }
          - { name: "kline-monitor",  dir: "services/kline_monitor",          dockerfile: "services/kline_monitor/Dockerfile" }
          - { name: "ai-tuner",       dir: "ai_tuner",                        dockerfile: "ai_tuner/Dockerfile" }
          - { name: "data-backend",   dir: "services/data_backend",           dockerfile: "services/data_backend/Dockerfile" }
          - { name: "dashboard-api",  dir: "dashboard/backend",               dockerfile: "dashboard/backend/Dockerfile" }

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: ⏭️ 判断是否需要构建
        id: decide
        run: |
          echo "=== 构建判断: ${{ matrix.service.name }} ==="

          # 获取所有变更文件
          CHANGED_FILES=$(git diff HEAD~1 HEAD --name-only 2>/dev/null || echo "")

          # 1. shared/ 或核心文件变了 → 全部重建
          if echo "$CHANGED_FILES" | grep -qE '^(shared/|docker-compose\.yml$|VERSION$)'; then
            echo "✅ shared/ 或 docker-compose.yml / VERSION 有改动 → 全部重建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. 自己的目录变了 → 构建
          DIR="${{ matrix.service.dir }}"
          if echo "$CHANGED_FILES" | grep -q "^${DIR}/"; then
            echo "✅ $DIR 下有改动 → 需要构建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. docker-compose.yml 改了（影响所有服务的 image tag 可能？）→ 安全起见全部重建
          if echo "$CHANGED_FILES" | grep -q "^docker-compose\.yml$"; then
            echo "✅ docker-compose.yml 有改动 → 全部重建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 4. deploy.yml 改了（不影响镜像）→ skip
          echo "⏭️ ${{ matrix.service.name }} 无改动 → 跳过构建"
          echo "should_build=false" >> "$GITHUB_OUTPUT"

      - name: 🔐 登录 GHCR
        if: steps.decide.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build + Push trading-${{ matrix.service.name }}
        if: steps.decide.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/trading-${{ matrix.service.name }}:latest

  # ============================================
  # Job 2: SSH 服务器部署
  # 不管 build 有没有真的构建（可能全 skip），都跑 deploy
  # docker compose pull → 只拉有新版本的 tag
  # docker compose up -d → 只 recreate 镜像变了的容器
  # ============================================
  deploy:
    name: 🚀 SSH 服务器部署
    needs: [detect, build-all]
    if: always() && needs.detect.result == 'success' && (needs.build-all.result == 'success' || needs.build-all.result == 'skipped' || needs.build-all.result == 'cancelled')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🔑 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 43.156.242.184 >> ~/.ssh/known_hosts

      - name: 📤 上传 docker-compose.yml（scp）
        run: scp -i ~/.ssh/id_rsa docker-compose.yml root@43.156.242.184:/root/trading_system/docker-compose.yml

      - name: 🚀 生成并上传远程部署脚本
        run: |
          cat > /tmp/deploy.sh << 'REMOTE_SCRIPT'
            set -e
            cd /root/trading_system

            echo "========================================"
            echo "CI/CD 自动部署"
            echo "时间: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "========================================"

            # 1. 服务器 GHCR 认证（首次）
            if ! docker image inspect ghcr.io/bearflower/trading-btc-eth:latest >/dev/null 2>&1; then
              echo "🔐 首次登录 GHCR..."
              echo "__GHCR_TOKEN__" | docker login ghcr.io -u bearflower --password-stdin
            fi

            # 2. 拉取有新版本的镜像（compose pull 自动对比 registry 标签）
            echo "📥 docker compose pull..."
            docker compose pull

            # 3. 只更新镜像变了的容器（compose up -d 自动检测）
            echo "🔄 docker compose up -d..."
            docker compose up -d --remove-orphans

            # 4. 等容器就绪
            echo "⏳ 等待 15s..."
            sleep 15

            # 5. 状态检查
            echo ""
            echo "✅ 当前容器状态："
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep -E "trading_system|ai-tuner|data-backend|dashboard-api" || echo "⚠️ 未找到 trading 相关容器"

            # 6. 写部署日志
            mkdir -p deploy_logs
            DEPLOY_TIME=$(date "+%Y-%m-%d %H:%M:%S")
            COMMIT_SHA="__COMMIT_SHA__"
            echo "[${DEPLOY_TIME}] DEPLOY_SUCCESS commit=${COMMIT_SHA}" >> "deploy_logs/$(date '+%Y%m%d').log"

            echo ""
            echo "========================================"
            echo "🎉 CI/CD 部署完成！"
            echo "========================================"
          REMOTE_SCRIPT
          sed -i "s|__GHCR_TOKEN__|${{ secrets.GHCR_PULL_TOKEN }}|g" /tmp/deploy.sh
          sed -i "s|__COMMIT_SHA__|${{ github.sha }}|g" /tmp/deploy.sh
          scp -i ~/.ssh/id_rsa /tmp/deploy.sh root@43.156.242.184:/tmp/deploy.sh

      - name: ▶️ 执行远程部署脚本
        run: ssh -i ~/.ssh/id_rsa root@43.156.242.184 "bash /tmp/deploy.sh && rm /tmp/deploy.sh"
