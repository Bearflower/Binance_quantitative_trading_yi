name: Scoped MTPCS read-only collector release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mtpcs-entry-intent-production
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify the single collector
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' '43.156.242.184 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFNCPR4nqDmkewu2141YjcAEiP/PD+cBEXMZKWDcAlSu' > ~/.ssh/known_hosts
          localdir=$(mktemp -d)
          cp strategies/btc_eth/shadow/{entry_study,entry_ledger}.py release/mtpcs-shadow/start.sh "$localdir/"
          (cd "$localdir"; sha256sum entry_study.py entry_ledger.py start.sh > files.sha256)
          remote=root@43.156.242.184
          folder="/root/trading_system/.releases/mtpcs-shadow/$GITHUB_SHA"
          ssh "$remote" "install -d -m 700 '$folder'"
          scp "$localdir"/* "$remote:$folder/"
          ssh "$remote" "bash '$folder/start.sh' '$GITHUB_SHA'"
