name: HRS execution repair candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test exact production successor with Python 3.11
        run: |
          docker build --target test -f release/hrs-execution/Dockerfile -t hrs-execution-test .
          docker run --rm --network none hrs-execution-test python -m pytest -q strategies/hrs/tests
      - name: Publish isolated HRS candidate
        run: |
          IMAGE=ghcr.io/bearflower/trading-hrs:hrs-repair-${{ github.sha }}
          docker build --target runtime -f release/hrs-execution/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          docker inspect "$IMAGE" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
