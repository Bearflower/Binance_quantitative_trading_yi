name: CI/CD — 构建镜像并自动部署

# ============================================
# Binance 量化交易系统 CI/CD 流水线（智能增量构建版 v2）
#
# 改动 → detect job 输出哪些服务变了（JSON 数组）
# 静态矩阵 10 个 job → 每个 job 开头检查自己该不该构建 → 该构建就 build，不该构建就 skip
# 服务器 deploy → docker compose pull/up 本身就是增量的
# ============================================

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'backtest/**'
      - 'tests/**'
      - '.trae/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: bearflower

# 静态服务清单 — 按字母序
# detect job 会输出 "BTC_ETH_CHANGED=true" 这样的变量
SERVICES: &ALL_SERVICES
  - { name: "btc-eth",        key: "BTC_ETH",        dockerfile: "strategies/btc_eth/Dockerfile" }
  - { name: "btc-eth-aggr",   key: "BTC_ETH_AGGR",   dockerfile: "strategies/btc_eth_aggressive/Dockerfile" }
  - { name: "new-coin",       key: "NEW_COIN",       dockerfile: "strategies/new_coin/Dockerfile" }
  - { name: "grid",           key: "GRID",           dockerfile: "strategies/grid/Dockerfile" }
  - { name: "hrs",            key: "HRS",            dockerfile: "strategies/hrs/Dockerfile" }
  - { name: "kline-service",  key: "KLINE_SERVICE",  dockerfile: "services/kline_service/Dockerfile" }
  - { name: "kline-monitor",  key: "KLINE_MONITOR",  dockerfile: "services/kline_monitor/Dockerfile" }
  - { name: "ai-tuner",       key: "AI_TUNER",       dockerfile: "ai_tuner/Dockerfile" }
  - { name: "data-backend",   key: "DATA_BACKEND",   dockerfile: "services/data_backend/Dockerfile" }
  - { name: "dashboard-api",  key: "DASHBOARD_API",  dockerfile: "dashboard/backend/Dockerfile" }

jobs:
  # ============================================
  # Job 0: 检测哪些路径变了 → 输出需要构建的服务列表
  # ============================================
  detect:
    name: 🔍 检测变更
    runs-on: ubuntu-latest
    outputs:
      # 输出 "true"/"false" 变量供各 build job 检查
      services_json: ${{ steps.decide.outputs.services_json }}
      all_triggered: ${{ steps.decide.outputs.all_triggered }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔍 路径过滤
        id: paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - 'shared/**'
              - 'docker-compose.yml'
              - 'VERSION'
            BTC_ETH:
              - 'strategies/btc_eth/**'
            BTC_ETH_AGGR:
              - 'strategies/btc_eth_aggressive/**'
            NEW_COIN:
              - 'strategies/new_coin/**'
            GRID:
              - 'strategies/grid/**'
            HRS:
              - 'strategies/hrs/**'
            KLINE_SERVICE:
              - 'services/kline_service/**'
            KLINE_MONITOR:
              - 'services/kline_monitor/**'
            AI_TUNER:
              - 'ai_tuner/**'
            DATA_BACKEND:
              - 'services/data_backend/**'
            DASHBOARD_API:
              - 'dashboard/backend/**'

      - name: 🏗️ 决定构建列表
        id: decide
        run: |
          echo "=== 本次 commit ==="
          echo "时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "触发: ${{ github.event_name }}"
          echo ""

          # shared 或核心文件变了 → 全部 10 个
          if [ "${{ steps.paths.outputs.shared }}" = "true" ]; then
            echo "✅ shared/ 或 docker-compose.yml 有改动 → 全部 10 个镜像需要重建"
            echo "all_triggered=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ 仅以下服务有改动："
            echo "all_triggered=false" >> "$GITHUB_OUTPUT"
          fi

          echo ""
          echo "路径检测结果："
          echo "  shared:       ${{ steps.paths.outputs.shared }}"
          echo "  BTC_ETH:      ${{ steps.paths.outputs.BTC_ETH }}"
          echo "  BTC_ETH_AGGR: ${{ steps.paths.outputs.BTC_ETH_AGGR }}"
          echo "  NEW_COIN:     ${{ steps.paths.outputs.NEW_COIN }}"
          echo "  GRID:         ${{ steps.paths.outputs.GRID }}"
          echo "  HRS:          ${{ steps.paths.outputs.HRS }}"
          echo "  KLINE_SERVICE:${{ steps.paths.outputs.KLINE_SERVICE }}"
          echo "  KLINE_MONITOR:${{ steps.paths.outputs.KLINE_MONITOR }}"
          echo "  AI_TUNER:     ${{ steps.paths.outputs.AI_TUNER }}"
          echo "  DATA_BACKEND: ${{ steps.paths.outputs.DATA_BACKEND }}"
          echo "  DASHBOARD_API:${{ steps.paths.outputs.DASHBOARD_API }}"

          # 构建 JSON 列表供 deploy 用（即使 build 全 skip 了 deploy 也知道谁变了）
          SERVICES_JSON="["
          ALL_TRIGGERED="${{ steps.paths.outputs.shared }}"
          if [ "$ALL_TRIGGERED" = "true" ]; then
            SERVICES_JSON='[{"name":"btc-eth"},{"name":"btc-eth-aggr"},{"name":"new-coin"},{"name":"grid"},{"name":"hrs"},{"name":"kline-service"},{"name":"kline-monitor"},{"name":"ai-tuner"},{"name":"data-backend"},{"name":"dashboard-api"}]'
          else
            [ "${{ steps.paths.outputs.BTC_ETH }}" = "true" ]         && SERVICES_JSON+='{"name":"btc-eth"},'
            [ "${{ steps.paths.outputs.BTC_ETH_AGGR }}" = "true" ]    && SERVICES_JSON+='{"name":"btc-eth-aggr"},'
            [ "${{ steps.paths.outputs.NEW_COIN }}" = "true" ]        && SERVICES_JSON+='{"name":"new-coin"},'
            [ "${{ steps.paths.outputs.GRID }}" = "true" ]            && SERVICES_JSON+='{"name":"grid"},'
            [ "${{ steps.paths.outputs.HRS }}" = "true" ]             && SERVICES_JSON+='{"name":"hrs"},'
            [ "${{ steps.paths.outputs.KLINE_SERVICE }}" = "true" ]   && SERVICES_JSON+='{"name":"kline-service"},'
            [ "${{ steps.paths.outputs.KLINE_MONITOR }}" = "true" ]   && SERVICES_JSON+='{"name":"kline-monitor"},'
            [ "${{ steps.paths.outputs.AI_TUNER }}" = "true" ]        && SERVICES_JSON+='{"name":"ai-tuner"},'
            [ "${{ steps.paths.outputs.DATA_BACKEND }}" = "true" ]    && SERVICES_JSON+='{"name":"data-backend"},'
            [ "${{ steps.paths.outputs.DASHBOARD_API }}" = "true" ]   && SERVICES_JSON+='{"name":"dashboard-api"},'
            SERVICES_JSON="${SERVICES_JSON%,}]"
          fi

          echo "services_json=$SERVICES_JSON" >> "$GITHUB_OUTPUT"
          echo ""
          echo "最终需要构建: $SERVICES_JSON"

  # ============================================
  # Job 1: 静态矩阵 10 个并行
  # 每个 job 开头判断：shared 变了 OR 自己对应的路径变了 → 才构建
  # 否则 echo skip && exit 0（秒级完成）
  # ============================================
  build-all:
    name: 🛠️ ${{ matrix.service.name }}
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: "btc-eth",        key: "BTC_ETH",        dockerfile: "strategies/btc_eth/Dockerfile" }
          - { name: "btc-eth-aggr",   key: "BTC_ETH_AGGR",   dockerfile: "strategies/btc_eth_aggressive/Dockerfile" }
          - { name: "new-coin",       key: "NEW_COIN",       dockerfile: "strategies/new_coin/Dockerfile" }
          - { name: "grid",           key: "GRID",           dockerfile: "strategies/grid/Dockerfile" }
          - { name: "hrs",            key: "HRS",            dockerfile: "strategies/hrs/Dockerfile" }
          - { name: "kline-service",  key: "KLINE_SERVICE",  dockerfile: "services/kline_service/Dockerfile" }
          - { name: "kline-monitor",  key: "KLINE_MONITOR",  dockerfile: "services/kline_monitor/Dockerfile" }
          - { name: "ai-tuner",       key: "AI_TUNER",       dockerfile: "ai_tuner/Dockerfile" }
          - { name: "data-backend",   key: "DATA_BACKEND",   dockerfile: "services/data_backend/Dockerfile" }
          - { name: "dashboard-api",  key: "DASHBOARD_API",  dockerfile: "dashboard/backend/Dockerfile" }

    steps:
      - name: 🚫 跳过判断
        id: should_build
        run: |
          # 直接把 needs.detect.outputs 作为 env 传进来不方便
          # 这里重新查一次 paths-filter 结果 → 但更简单：用 all_triggered 或 matrix key 判断
          # 最稳的方式：fetch 上次 commit 然后 diff 判断
          echo "needs.detect.outputs.all_triggered = ${{ needs.detect.outputs.all_triggered }}"
          echo "matrix key = ${{ matrix.service.key }}"

      - uses: actions/checkout@v4

      - name: 🧩 复用路径检测结果
        id: paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - 'shared/**'
              - 'docker-compose.yml'
              - 'VERSION'
            BTC_ETH:
              - 'strategies/btc_eth/**'
            BTC_ETH_AGGR:
              - 'strategies/btc_eth_aggressive/**'
            NEW_COIN:
              - 'strategies/new_coin/**'
            GRID:
              - 'strategies/grid/**'
            HRS:
              - 'strategies/hrs/**'
            KLINE_SERVICE:
              - 'services/kline_service/**'
            KLINE_MONITOR:
              - 'services/kline_monitor/**'
            AI_TUNER:
              - 'ai_tuner/**'
            DATA_BACKEND:
              - 'services/data_backend/**'
            DASHBOARD_API:
              - 'dashboard/backend/**'

      - name: ⏭️ 决定是否跳过
        id: decide
        run: |
          ALL_TRIGGERED="${{ steps.paths.outputs.shared }}"
          SELF_TRIGGERED="${{ steps.paths.outputs.${{ matrix.service.key }} }}"

          if [ "$ALL_TRIGGERED" = "true" ] || [ "$SELF_TRIGGERED" = "true" ]; then
            echo "✅ shared=${ALL_TRIGGERED} self(${{ matrix.service.key }})=${SELF_TRIGGERED} → 需要构建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "⏭️ 本服务无改动 → 跳过"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🐳 Build + Push
        if: steps.decide.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/trading-${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Job 2: SSH 部署
  # 不管 build 有没有构建成功（可能全 skip），都跑 deploy
  # docker compose pull → 只拉有新版本的 tag
  # docker compose up -d → 只 recreate 镜像变了的容器
  # ============================================
  deploy:
    name: 🚀 SSH 服务器部署
    needs: [detect, build-all]
    if: always() && needs.detect.result == 'success' && (needs.build-all.result == 'success' || needs.build-all.result == 'skipped' || needs.build-all.result == 'cancelled')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🔑 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 43.156.242.184 >> ~/.ssh/known_hosts

      - name: 📤 上传 docker-compose.yml（scp）
        run: scp -i ~/.ssh/id_rsa docker-compose.yml root@43.156.242.184:/root/trading_system/docker-compose.yml

      - name: 🚀 生成并上传远程部署脚本
        run: |
          cat > /tmp/deploy.sh << 'REMOTE_SCRIPT'
            set -e
            cd /root/trading_system

            echo "========================================"
            echo "CI/CD 自动部署"
            echo "时间: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "========================================"

            # 1. 服务器 GHCR 认证（首次）
            if ! docker image inspect ghcr.io/bearflower/trading-btc-eth:latest >/dev/null 2>&1; then
              echo "🔐 首次登录 GHCR..."
              echo "__GHCR_TOKEN__" | docker login ghcr.io -u bearflower --password-stdin
            fi

            # 2. 拉取有新版本的镜像（compose pull 自动对比 registry 标签）
            echo "📥 docker compose pull..."
            docker compose pull

            # 3. 只更新镜像变了的容器（compose up -d 自动检测）
            echo "🔄 docker compose up -d..."
            docker compose up -d --remove-orphans

            # 4. 等容器就绪
            echo "⏳ 等待 15s..."
            sleep 15

            # 5. 状态检查
            echo ""
            echo "✅ 当前容器状态："
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep -E "trading_system|ai-tuner|data-backend|dashboard-api" || echo "⚠️ 未找到 trading 相关容器"

            # 6. 写部署日志
            mkdir -p deploy_logs
            DEPLOY_TIME=$(date "+%Y-%m-%d %H:%M:%S")
            COMMIT_SHA="__COMMIT_SHA__"
            echo "[${DEPLOY_TIME}] DEPLOY_SUCCESS commit=${COMMIT_SHA}" >> "deploy_logs/$(date '+%Y%m%d').log"

            echo ""
            echo "========================================"
            echo "🎉 CI/CD 部署完成！"
            echo "========================================"
          REMOTE_SCRIPT
          sed -i "s|__GHCR_TOKEN__|${{ secrets.GHCR_PULL_TOKEN }}|g" /tmp/deploy.sh
          sed -i "s|__COMMIT_SHA__|${{ github.sha }}|g" /tmp/deploy.sh
          scp -i ~/.ssh/id_rsa /tmp/deploy.sh root@43.156.242.184:/tmp/deploy.sh

      - name: ▶️ 执行远程部署脚本
        run: ssh -i ~/.ssh/id_rsa root@43.156.242.184 "bash /tmp/deploy.sh && rm /tmp/deploy.sh"
