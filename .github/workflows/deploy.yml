name: HRS shared market cap candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Offline integration and regression tests
        run: |
          docker build --target test -f release/hrs-execution/MarketCap.Dockerfile -t market-cap-test .
          docker run --rm --network none market-cap-test python -m pytest -q strategies/hrs/tests tests/test_shared/test_market_cap_hub.py tests/test_ai_tuner_mvp/test_snapshot_collector.py tests/test_ai_tuner_mvp/test_snapshot_repository.py
      - name: Publish isolated candidates
        run: |
          for TARGET in hrs snapshot hub; do
            IMAGE=ghcr.io/bearflower/trading-hrs:market-cap-$TARGET-${{ github.sha }}
            docker build --target "$TARGET" -f release/hrs-execution/MarketCap.Dockerfile -t "$IMAGE" .
            docker push "$IMAGE"
            docker inspect "$IMAGE" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
          done
