name: CI/CD — 构建镜像并自动部署

# ============================================
# Binance 量化交易系统 CI/CD 流水线
# push main → Actions 构建 10 个镜像 → GHCR → SSH 服务器 pull + up + 写日志
# ============================================

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'backtest/**'
      - 'tests/**'
      - '.trae/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: bearflower

jobs:
  # ============================================
  # Job 1: 矩阵并行构建 10 个镜像 + 推送 GHCR
  # ============================================
  build-all:
    name: 构建全部镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: "btc-eth",       dockerfile: "strategies/btc_eth/Dockerfile" }
          - { name: "btc-eth-aggr",  dockerfile: "strategies/btc_eth_aggressive/Dockerfile" }
          - { name: "new-coin",      dockerfile: "strategies/new_coin/Dockerfile" }
          - { name: "grid",          dockerfile: "strategies/grid/Dockerfile" }
          - { name: "hrs",           dockerfile: "strategies/hrs/Dockerfile" }
          - { name: "kline-service", dockerfile: "services/kline_service/Dockerfile" }
          - { name: "kline-monitor", dockerfile: "services/kline_monitor/Dockerfile" }
          - { name: "ai-tuner",      dockerfile: "ai_tuner/Dockerfile" }
          - { name: "data-backend",  dockerfile: "services/data_backend/Dockerfile" }
          - { name: "dashboard-api", dockerfile: "dashboard/backend/Dockerfile" }

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: 🐳 安装 Buildx（启用 GHA 缓存支持）
        uses: docker/setup-buildx-action@v3

      - name: 🔐 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ 构建并推送 trading-${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/trading-${{ matrix.service.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/trading-${{ matrix.service.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Job 2: SSH 到服务器执行部署
  # 等所有镜像都构建好再部署
  # ============================================
  deploy:
    name: SSH 服务器部署
    needs: build-all
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🔑 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 43.156.242.184 >> ~/.ssh/known_hosts

      - name: 🚀 远程部署 — pull + up + 写日志
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@43.156.242.184 'bash -s' << 'REMOTE_EOF'
            set -e
            cd /root/trading_system

            echo "========================================"
            echo "CI/CD 自动部署开始"
            echo "时间: $(date "+%Y-%m-%d %H:%M:%S")"
            echo "========================================"

            # 1. 服务器 GHCR 认证（首次）
            if ! docker image inspect ghcr.io/bearflower/trading-btc-eth:latest >/dev/null 2>&1; then
              echo "🔐 首次部署，登录 GHCR..."
              echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u bearflower --password-stdin
            fi

            # 2. 同步 docker-compose.yml（本地已改成 image: ghcr.io/xxx）
            echo "📤 同步 docker-compose.yml..."
            cat > /root/trading_system/docker-compose.yml << 'COMPOSE_EOF'
$(cat docker-compose.yml)
COMPOSE_EOF

            # 3. 拉取新镜像
            echo "📥 拉取新镜像..."
            docker compose pull 2>&1 | tail -5

            # 4. 滚动更新容器
            echo "🔄 滚动更新容器..."
            docker compose up -d --remove-orphans

            # 5. 等容器就绪
            echo "⏳ 等待 15s 让容器启动..."
            sleep 15

            # 6. 检查状态
            echo ""
            echo "✅ 当前容器状态："
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep -E "trading_system|ai-tuner"

            # 7. 写部署日志
            mkdir -p deploy_logs
            DEPLOY_TIME=$(date "+%Y-%m-%d %H:%M:%S")
            echo "[${DEPLOY_TIME}] DEPLOY_SUCCESS commit=${{ github.sha }} triggered_by=${{ github.actor }}" >> "deploy_logs/$(date "+%Y%m%d").log"

            echo ""
            echo "========================================"
            echo "🎉 CI/CD 部署完成！"
            echo "========================================"
          REMOTE_EOF
