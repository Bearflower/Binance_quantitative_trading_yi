name: CI/CD — 构建镜像并自动部署

# ============================================
# Binance 量化交易系统 CI/CD 流水线（智能增量构建 v3）
#
# 改了啥 → 只构建啥：
#   shared/** 改了 → 全部 11 个重建
#   只改某个策略目录 → 只构建那个
#
# 原理：
#   detect job 先跑 git diff 看有哪些路径变了
#   静态 11 个 build job → 每个开头 git diff 自己判断要不要 build
#   服务器 deploy → docker compose pull/up 本身就是增量的
# ============================================

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'backtest/**'
      - 'tests/**'
      - '.trae/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # 并发策略（2026-10-16）：
  # 1) cancel-in-progress: false —— 在跑的 Run 不中途取消，避免 build-all 半途夭折使 GHCR 出现
  #    「部分服务已重建、部分未重建」的撕裂镜像集（旧 true 曾在 2026-10-15 run 78 致混版部署）。
  # 2) queue: max —— 最多 100 个 pending Run 排队、FIFO 依次执行且互不取消。默认 queue: single 会把
  #    旧 pending Run 顶替（cancel），而每次 Run 的 diff 仅覆盖自身 push 范围 before..HEAD，
  #    被顶替那次推送的目录变更便不被后继 Run 覆盖 → 静默丢失；queue: max 闭合此路径。
  #    （queue: max 可与 cancel-in-progress: false 并用，不可与 true 并用，否则校验报错）
  # 残留（独立于本次修复）：构建失败的 Run 其变更不被后继 Run 覆盖 —— Run 变红可见、可重跑恢复；
  #    如需根治可持久化 last-deployed sha 作 diff 基。
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: bearflower

jobs:
  # ============================================
  # Job 0: 路径过滤（纯诊断，不参与矩阵展开）
  # ============================================
  detect:
    name: 🔍 检测变更
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 全量历史：判定需要 before..sha 整段推送范围的 diff
          fetch-depth: 0

      - name: 🔍 路径过滤
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # 输出 changed_files = 变更文件列表
          filters: |
            changes:
              - '!docs/**'
              - '!backtest/**'
              - '!tests/**'
              - '!.trae/**'
              - '!*.md'

      - name: 📋 输出变更文件清单
        # 提交信息用户可控：走 env 传值，避免单引号逃逸引发 shell 二次解析
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          echo "=== 本次 commit (${{ github.sha }}) 改动 ==="
          echo "Commit message: $(printf '%s' "$COMMIT_MESSAGE" | tr '\n' ' ')"
          echo ""
          echo "检测到变更（自动过滤 docs/backtest/tests/.trae/*.md）"

  # ============================================
  # Job 1: 静态 11 个矩阵并行
  # 每个 job 用整段推送范围（github.event.before..sha）判断：
  #   shared/** 或 VERSION / docker-compose.yml 改了 → 全部构建
  #   变更全部落在 .github/** → 全部构建（无法判断历史构建状态，避免死循环）
  #   自己的目录改了 → 构建
  #   否则 → skip（秒级 exit 0）
  # ============================================
  build-all:
    name: 🛠️ ${{ matrix.service.name }}
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: "btc-eth",        dir: "strategies/btc_eth",              dockerfile: "strategies/btc_eth/Dockerfile" }
          - { name: "btc-eth-aggr",   dir: "strategies/btc_eth_aggressive",   dockerfile: "strategies/btc_eth_aggressive/Dockerfile" }
          - { name: "new-coin",       dir: "strategies/new_coin",             dockerfile: "strategies/new_coin/Dockerfile" }
          - { name: "grid",           dir: "strategies/grid",                 dockerfile: "strategies/grid/Dockerfile" }
          - { name: "hrs",            dir: "strategies/hrs",                  dockerfile: "strategies/hrs/Dockerfile" }
          - { name: "kline-service",  dir: "services/kline_service",          dockerfile: "services/kline_service/Dockerfile" }
          - { name: "kline-monitor",  dir: "services/kline_monitor",          dockerfile: "services/kline_monitor/Dockerfile" }
          - { name: "ai-tuner",       dir: "ai_tuner",                        dockerfile: "ai_tuner/Dockerfile" }
          - { name: "data-backend",   dir: "services/data_backend",           dockerfile: "services/data_backend/Dockerfile" }
          - { name: "dashboard-api",  dir: "dashboard/backend",               dockerfile: "dashboard/backend/Dockerfile" }
          - { name: "aggtrade-collector", dir: "services/aggtrade_collector", dockerfile: "services/aggtrade_collector/Dockerfile" }

    steps:
      - uses: actions/checkout@v4
        with:
          # 全量历史：判定需要 before..sha 整段推送范围的 diff
          fetch-depth: 0

      - name: ⏭️ 判断是否需要构建
        id: decide
        run: |
          echo "=== 构建判断: ${{ matrix.service.name }} ==="

          # 1) 取本次推送范围 before..HEAD
          #    before 为全 0（首次推送/新建分支）时无从比对，回退到 HEAD~1
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi

          # 2) 范围不可用（浅克隆/孤儿提交/before 提交本地不可达）→ fail-safe：宁可多建，不可静默不建
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "⚠️ 无法确定推送范围 → fail-safe 全量重建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3) 取整段推送范围的变更文件（而非仅最后一个提交）
          CHANGED_FILES=$(git diff "$BASE" HEAD --name-only)
          echo "推送范围: ${BASE}..HEAD"
          echo "$CHANGED_FILES"

          # 首次创建/规范 retry marker 是一次性部署事务：失败 Run 的镜像不可复用。
          # 本次只强制重建 calibrated 共用的 btc-eth 镜像，其他矩阵服务跳过。
          SERVICE_NAME="${{ matrix.service.name }}"
          DEPLOY_MODE=$(python3 scripts/select_deploy_mode.py \
            --event-name "${{ github.event_name }}" \
            --base "$BASE" \
            --head HEAD)
          if [ "$DEPLOY_MODE" = "calibrated-first-create" ]; then
            if [ "$SERVICE_NAME" = "btc-eth" ]; then
              echo "✅ calibrated 首次创建事务 → 强制重建 btc-eth 镜像"
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "⏭️ calibrated 首次创建事务 → 跳过非 btc-eth 服务"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # 仅变更分批日志覆盖配置和本工作流时无需重建业务镜像。
          # Compose 会按 logging 配置只 recreate 本批服务；全项目 COPY 的镜像也无需重建。
          if [ -n "$CHANGED_FILES" ] && [ -z "$(echo "$CHANGED_FILES" | grep -vE '^(docker-compose\.logging\.yml|\.github/workflows/deploy\.yml|docs/deployment/log-retention\.md|scripts/archive_container_logs\.sh|tests/test_log_archive\.py)$')" ]; then
            echo "✅ 仅日志覆盖配置/部署工作流变化 → 跳过镜像构建"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 4) shared/ 或 docker-compose.yml / VERSION 变了 → 全部重建
          if echo "$CHANGED_FILES" | grep -qE '^(shared/|docker-compose\.yml$|VERSION$)'; then
            echo "✅ shared/ 或 docker-compose.yml / VERSION 有改动 → 全部重建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 5) 变更全部落在 .github/（工作流自身变更）→ 无法判断历史镜像是否已构建 → 全量重建
          #    否则会形成死循环：CI 修复提交只改 deploy.yml → 10 个 job 全 skip → 修复代码永远不上线
          if [ -n "$CHANGED_FILES" ] && [ -z "$(echo "$CHANGED_FILES" | grep -v '^\.github/')" ]; then
            echo "✅ 仅 .github/ 有改动 → 无法判断历史构建状态 → 全量重建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 6) 自己的目录变了 → 构建
          DIR="${{ matrix.service.dir }}"
          if echo "$CHANGED_FILES" | grep -q "^${DIR}/"; then
            echo "✅ $DIR 下有改动 → 需要构建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 6.5) 全项目 COPY 服务（hrs/dashboard-api）：任何非 .github/ 变更都触发重建
          #     原因：它们的 Dockerfile 是 `COPY . /app/` 或 `COPY . .`，
          #     会把整个仓库（包括 services/、shared/、其他 strategies/）复制进去，
          #     任何项目文件变更都会影响镜像内容
          FULL_COPY_SERVICES="hrs|dashboard-api"
          if echo "$SERVICE_NAME" | grep -qE "^(${FULL_COPY_SERVICES})$"; then
            NON_GITHUB_CHANGES=$(echo "$CHANGED_FILES" | grep -v '^\.github/' | head -1)
            if [ -n "$NON_GITHUB_CHANGES" ]; then
              echo "✅ 全项目 COPY 服务（$SERVICE_NAME），有非 .github/ 变更 → 需要构建"
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # 6.6) data-backend：Dockerfile 除自身代码外还 COPY 了
          #      dashboard/backend/{core,config,services}（performance_metric 定时任务
          #      在 data-backend 容器内共用 data_service_docker.py），因此
          #      dashboard/backend/ 下任何变更（不只 dashboard-api 自身）都必须重建 data-backend，
          #      否则出现"只重建 dashboard-api、data-backend 快照口径滞后"的部署遗漏
          #      场景实证：2026-10-14 8cf1ae4 修复 _DAILY_PNL_QUERY 持仓级防双计，
          #      仅触发 dashboard-api 重建，data-backend 绩效快照仍按旧天级口径计算
          if [ "$SERVICE_NAME" = "data-backend" ]; then
            if echo "$CHANGED_FILES" | grep -qE '^(dashboard/backend/|services/data_backend/)'; then
              echo "✅ dashboard/backend 或 services/data_backend 有改动 → data-backend 需要构建"
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # 7) 其他改动（不影响本服务镜像）→ skip
          echo "⏭️ ${{ matrix.service.name }} 无改动 → 跳过构建"
          echo "should_build=false" >> "$GITHUB_OUTPUT"

      - name: 📊 记录构建决策到 Summary
        # decide 正常结束即记录，便于人工/AI 一眼看出本次实际构建了哪些服务
        if: steps.decide.outcome == 'success'
        run: |
          if [ "${{ steps.decide.outputs.should_build }}" = "true" ]; then
            echo "- ✅ 已构建 trading-${{ matrix.service.name }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ⏭️ 跳过 trading-${{ matrix.service.name }}（无本服务相关改动）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 🏷️ 生成 VERSION（注入本次 Run 元数据）
        # 位置必须在 🐳 Build + Push（context: .）之前，使生成的 VERSION 进入 build context
        if: steps.decide.outputs.should_build == 'true'
        env:
          # 提交信息用户可控：走 env 传值 + printf，避免引号/中文/换行破坏 shell 解析
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # DEPLOY_ID：确定性且可追溯到本次 Run（不用随机 uuid，便于事后核对）
          # 高 24 位 = run_number，低 8 位 = run_attempt；可反解：id>>8 / id&0xFF
          DEPLOY_ID=$(printf '%08X' $(( (${{ github.run_number }} << 8) | ${{ github.run_attempt }} )))
          # DEPLOY_TIME 统一用 UTC，避免与服务器本地时区混淆
          DEPLOY_TIME=$(date -u '+%Y-%m-%d %H:%M:%S')
          GIT_SHA="${{ github.sha }}"
          GIT_SHORT=$(printf '%s' "$GIT_SHA" | cut -c1-7)
          # 提交标题仅取首行（提交信息可能多行）
          COMMIT_TITLE=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n1)
          cat > VERSION <<VERSION_EOF
          DEPLOY_TIME=${DEPLOY_TIME}
          GIT_COMMIT=${GIT_SHORT} ${COMMIT_TITLE}
          GIT_SHA=${GIT_SHA}
          DEPLOY_ID=${DEPLOY_ID}
          VERSION_EOF

          RUN_META="run_number=${{ github.run_number }}, run_attempt=${{ github.run_attempt }}"
          echo "=== 本次构建写入的 VERSION ==="
          cat VERSION
          echo "${RUN_META} GIT_SHA=${GIT_SHA}"
          echo "### 🏷️ 构建 VERSION — trading-${{ matrix.service.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- DEPLOY_ID: ${DEPLOY_ID} (${RUN_META})" >> "$GITHUB_STEP_SUMMARY"
          echo "- GIT_SHA: ${GIT_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- DEPLOY_TIME(UTC): ${DEPLOY_TIME}" >> "$GITHUB_STEP_SUMMARY"

      - name: 🔐 登录 GHCR
        if: steps.decide.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build + Push trading-${{ matrix.service.name }}
        if: steps.decide.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/trading-${{ matrix.service.name }}:latest

  # ============================================
  # Job 2: SSH 服务器部署
  # 矩阵构建 job 成功后部署；矩阵内单项可按变更判定跳过构建 step
  # docker compose pull → 只拉有新版本的 tag
  # docker compose up -d → 只 recreate 镜像变了的容器
  # ============================================
  deploy:
    name: 🚀 SSH 服务器部署
    needs: [detect, build-all]
    if: needs.detect.result == 'success' && needs.build-all.result == 'success'
    runs-on: ubuntu-latest
    env:
      REMOTE_DEPLOY_SCRIPT: /root/trading_system/.deploy_tmp/deploy-${{ github.run_id }}-${{ github.run_attempt }}.sh

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🎯 选择部署模式
        id: deployment_mode
        run: |
          BASE="${{ github.event.before }}"
          DEPLOY_MODE=$(python3 scripts/select_deploy_mode.py \
            --event-name "${{ github.event_name }}" \
            --base "$BASE" \
            --head HEAD)
          echo "mode=${DEPLOY_MODE}" >> "$GITHUB_OUTPUT"
          echo "部署模式: ${DEPLOY_MODE}"

      - name: 🔑 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 43.156.242.184 >> ~/.ssh/known_hosts

          # 写 SSH 客户端配置：Host/User/IdentityFile 与超时加固参数在此统一定义一次。
          # 后续所有 scp/ssh 调用自动继承，无需再显式指定 `-i` 与 `root@`（并非漏写），
          # 既避免重复书写导致静默挂起，也消除了三处调用中 `-i`/`root@` 的冗余。
          cat >> ~/.ssh/config << 'SSH_CONFIG'
          Host 43.156.242.184
            User root
            IdentityFile ~/.ssh/id_rsa
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 3
          SSH_CONFIG
          chmod 600 ~/.ssh/config

          # 写公共重试函数：仅供后续 step 通过 source 复用，避免重复代码。
          # 关键设计：只在 exit 255（连接层失败）时重试；其余 exit code 立即返回。
          # 因为远程部署脚本有真实副作用（pull/up/写部署日志），
          # 对脚本自身失败重试会造成重复部署与审计日志污染，故仅连接失败才重试。
          cat > /tmp/ci_retry.sh << 'RETRY_SH'
          retry_connect() {
            local i rc
            for i in 1 2 3; do
              rc=0
              "$@" || rc=$?
              if [ "$rc" -eq 0 ]; then
                return 0
              fi
              if [ "$rc" -ne 255 ]; then
                echo "❌ 非连接类失败（exit ${rc}），不重试"
                return "$rc"
              fi
              echo "⚠️ 连接失败（exit 255），第 ${i}/3 次，15s 后重试..."
              sleep 15
            done
            echo "❌ 连接重试 3 次仍失败"
            return 255
          }
          RETRY_SH

      - name: 🔐 远端登录 GHCR
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -o pipefail
          for i in 1 2 3; do
            rc=0
            printf '%s' "$GHCR_PULL_TOKEN" | ssh 43.156.242.184 \
              "docker login ghcr.io -u bearflower --password-stdin" || rc=$?
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if [ "$rc" -ne 255 ]; then
              echo "❌ GHCR 登录失败（exit ${rc}），不重试"
              exit "$rc"
            fi
            echo "⚠️ GHCR 登录连接失败（exit 255），第 ${i}/3 次，15s 后重试..."
            sleep 15
          done
          echo "❌ GHCR 登录连接重试 3 次仍失败"
          exit 255

      - name: 📤 上传 docker-compose.yml（scp）
        run: |
          source /tmp/ci_retry.sh
          retry_connect scp docker-compose.yml 43.156.242.184:/root/trading_system/docker-compose.yml
          retry_connect scp docker-compose.logging.yml 43.156.242.184:/root/trading_system/docker-compose.logging.yml
          retry_connect ssh 43.156.242.184 "mkdir -p /root/trading_system/scripts"
          retry_connect scp scripts/archive_container_logs.sh 43.156.242.184:/root/trading_system/scripts/archive_container_logs.sh

      - name: 📦 同步数据库 init-scripts
        if: steps.deployment_mode.outputs.mode == 'full'
        run: |
          source /tmp/ci_retry.sh
          # 空目录安全：git checkout 可能因 sparse/fetch-depth 漏拉 database/，此时跳过
          if [ ! -d "database/postgres/init-scripts" ] || [ -z "$(ls -A database/postgres/init-scripts 2>/dev/null)" ]; then
            echo "⏭️ init-scripts 目录不存在或为空，跳过同步"
            exit 0
          fi
          # 确保服务器父目录存在（compose 用 ./database/postgres/init-scripts 相对路径挂载）
          retry_connect ssh 43.156.242.184 "mkdir -p /root/trading_system/database/postgres"
          # 源路径无尾部斜杠 → 整个 init-scripts/ 目录作为子目录落到服务器父级下
          retry_connect scp -r database/postgres/init-scripts 43.156.242.184:/root/trading_system/database/postgres/
          echo "✅ init-scripts 已同步，文件清单："
          ls -1 database/postgres/init-scripts/

      - name: 🚀 生成并上传远程部署脚本
        run: |
          LOCAL_DEPLOY_SCRIPT="${RUNNER_TEMP}/deploy-${{ github.run_id }}-${{ github.run_attempt }}.sh"
          trap 'rm -f "$LOCAL_DEPLOY_SCRIPT"' EXIT
          # DEPLOY_ID 与 build 侧同一公式（高 24 位 run_number、低 8 位 run_attempt，可反解），
          # 注入远程脚本，使部署日志中的 deploy_id 可与本次构建的容器一一核对
          DEPLOY_ID=$(printf '%08X' $(( (${{ github.run_number }} << 8) | ${{ github.run_attempt }} )))
          python3 scripts/render_remote_deploy.py \
            --source scripts/remote_deploy_runtime.sh \
            --output "$LOCAL_DEPLOY_SCRIPT" \
            --mode "${{ steps.deployment_mode.outputs.mode }}" \
            --commit-sha "${{ github.sha }}" \
            --deploy-id "$DEPLOY_ID"
          source /tmp/ci_retry.sh
          retry_connect ssh 43.156.242.184 \
            "mkdir -p /root/trading_system/.deploy_tmp && chmod 700 /root/trading_system/.deploy_tmp"
          retry_connect scp "$LOCAL_DEPLOY_SCRIPT" \
            "43.156.242.184:${REMOTE_DEPLOY_SCRIPT}"
          retry_connect ssh 43.156.242.184 \
            "chmod 700 \"$REMOTE_DEPLOY_SCRIPT\""

      - name: ▶️ 执行远程部署脚本
        run: |
          # 部署脚本可能合法返回 255；不得交给连接重试器，以免误判并重复副作用。
          # 若 SSH 本身失败，脚本可能遗留，但它不含 token 且位于 root-only 目录。
          ssh 43.156.242.184 bash -s -- "$REMOTE_DEPLOY_SCRIPT" \
            < scripts/run_remote_deploy.sh
