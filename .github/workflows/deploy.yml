name: CI/CD — 构建镜像并自动部署

# ============================================
# Binance 量化交易系统 CI/CD 流水线（智能增量构建 v3）
#
# 改了啥 → 只构建啥：
#   shared/** 改了 → 全部 10 个重建
#   只改某个策略目录 → 只构建那个
#
# 原理：
#   detect job 先跑 git diff 看有哪些路径变了
#   静态 10 个 build job → 每个开头 git diff 自己判断要不要 build
#   服务器 deploy → docker compose pull/up 本身就是增量的
# ============================================

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'backtest/**'
      - 'tests/**'
      - '.trae/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: bearflower

jobs:
  # ============================================
  # Job 0: 路径过滤（纯诊断，不参与矩阵展开）
  # ============================================
  detect:
    name: 🔍 检测变更
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 全量历史：判定需要 before..sha 整段推送范围的 diff
          fetch-depth: 0

      - name: 🔍 路径过滤
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # 输出 changed_files = 变更文件列表
          filters: |
            changes:
              - '!docs/**'
              - '!backtest/**'
              - '!tests/**'
              - '!.trae/**'
              - '!*.md'

      - name: 📋 输出变更文件清单
        # 提交信息用户可控：走 env 传值，避免单引号逃逸引发 shell 二次解析
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          echo "=== 本次 commit (${{ github.sha }}) 改动 ==="
          echo "Commit message: $(printf '%s' "$COMMIT_MESSAGE" | tr '\n' ' ')"
          echo ""
          echo "检测到变更（自动过滤 docs/backtest/tests/.trae/*.md）"

  # ============================================
  # Job 1: 静态 10 个矩阵并行
  # 每个 job 用整段推送范围（github.event.before..sha）判断：
  #   shared/** 或 VERSION / docker-compose.yml 改了 → 全部构建
  #   变更全部落在 .github/** → 全部构建（无法判断历史构建状态，避免死循环）
  #   自己的目录改了 → 构建
  #   否则 → skip（秒级 exit 0）
  # ============================================
  build-all:
    name: 🛠️ ${{ matrix.service.name }}
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: "btc-eth",        dir: "strategies/btc_eth",              dockerfile: "strategies/btc_eth/Dockerfile" }
          - { name: "btc-eth-aggr",   dir: "strategies/btc_eth_aggressive",   dockerfile: "strategies/btc_eth_aggressive/Dockerfile" }
          - { name: "new-coin",       dir: "strategies/new_coin",             dockerfile: "strategies/new_coin/Dockerfile" }
          - { name: "grid",           dir: "strategies/grid",                 dockerfile: "strategies/grid/Dockerfile" }
          - { name: "hrs",            dir: "strategies/hrs",                  dockerfile: "strategies/hrs/Dockerfile" }
          - { name: "kline-service",  dir: "services/kline_service",          dockerfile: "services/kline_service/Dockerfile" }
          - { name: "kline-monitor",  dir: "services/kline_monitor",          dockerfile: "services/kline_monitor/Dockerfile" }
          - { name: "ai-tuner",       dir: "ai_tuner",                        dockerfile: "ai_tuner/Dockerfile" }
          - { name: "data-backend",   dir: "services/data_backend",           dockerfile: "services/data_backend/Dockerfile" }
          - { name: "dashboard-api",  dir: "dashboard/backend",               dockerfile: "dashboard/backend/Dockerfile" }

    steps:
      - uses: actions/checkout@v4
        with:
          # 全量历史：判定需要 before..sha 整段推送范围的 diff
          fetch-depth: 0

      - name: ⏭️ 判断是否需要构建
        id: decide
        run: |
          echo "=== 构建判断: ${{ matrix.service.name }} ==="

          # 1) 取本次推送范围 before..HEAD
          #    before 为全 0（首次推送/新建分支）时无从比对，回退到 HEAD~1
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi

          # 2) 范围不可用（浅克隆/孤儿提交/before 提交本地不可达）→ fail-safe：宁可多建，不可静默不建
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "⚠️ 无法确定推送范围 → fail-safe 全量重建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3) 取整段推送范围的变更文件（而非仅最后一个提交）
          CHANGED_FILES=$(git diff "$BASE" HEAD --name-only)
          echo "推送范围: ${BASE}..HEAD"
          echo "$CHANGED_FILES"

          # 4) shared/ 或 docker-compose.yml / VERSION 变了 → 全部重建
          if echo "$CHANGED_FILES" | grep -qE '^(shared/|docker-compose\.yml$|VERSION$)'; then
            echo "✅ shared/ 或 docker-compose.yml / VERSION 有改动 → 全部重建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 5) 变更全部落在 .github/（工作流自身变更）→ 无法判断历史镜像是否已构建 → 全量重建
          #    否则会形成死循环：CI 修复提交只改 deploy.yml → 10 个 job 全 skip → 修复代码永远不上线
          if [ -n "$CHANGED_FILES" ] && [ -z "$(echo "$CHANGED_FILES" | grep -v '^\.github/')" ]; then
            echo "✅ 仅 .github/ 有改动 → 无法判断历史构建状态 → 全量重建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 6) 自己的目录变了 → 构建
          DIR="${{ matrix.service.dir }}"
          if echo "$CHANGED_FILES" | grep -q "^${DIR}/"; then
            echo "✅ $DIR 下有改动 → 需要构建"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 7) 其他改动（不影响本服务镜像）→ skip
          echo "⏭️ ${{ matrix.service.name }} 无改动 → 跳过构建"
          echo "should_build=false" >> "$GITHUB_OUTPUT"

      - name: 📊 记录构建决策到 Summary
        # decide 正常结束即记录，便于人工/AI 一眼看出本次实际构建了哪些服务
        if: steps.decide.outcome == 'success'
        run: |
          if [ "${{ steps.decide.outputs.should_build }}" = "true" ]; then
            echo "- ✅ 已构建 trading-${{ matrix.service.name }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ⏭️ 跳过 trading-${{ matrix.service.name }}（无本服务相关改动）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 🏷️ 生成 VERSION（注入本次 Run 元数据）
        # 位置必须在 🐳 Build + Push（context: .）之前，使生成的 VERSION 进入 build context
        if: steps.decide.outputs.should_build == 'true'
        env:
          # 提交信息用户可控：走 env 传值 + printf，避免引号/中文/换行破坏 shell 解析
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # DEPLOY_ID：确定性且可追溯到本次 Run（不用随机 uuid，便于事后核对）
          # 高 24 位 = run_number，低 8 位 = run_attempt；可反解：id>>8 / id&0xFF
          DEPLOY_ID=$(printf '%08X' $(( (${{ github.run_number }} << 8) | ${{ github.run_attempt }} )))
          # DEPLOY_TIME 统一用 UTC，避免与服务器本地时区混淆
          DEPLOY_TIME=$(date -u '+%Y-%m-%d %H:%M:%S')
          GIT_SHA="${{ github.sha }}"
          GIT_SHORT=$(printf '%s' "$GIT_SHA" | cut -c1-7)
          # 提交标题仅取首行（提交信息可能多行）
          COMMIT_TITLE=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n1)
          cat > VERSION <<VERSION_EOF
          DEPLOY_TIME=${DEPLOY_TIME}
          GIT_COMMIT=${GIT_SHORT} ${COMMIT_TITLE}
          GIT_SHA=${GIT_SHA}
          DEPLOY_ID=${DEPLOY_ID}
          VERSION_EOF

          RUN_META="run_number=${{ github.run_number }}, run_attempt=${{ github.run_attempt }}"
          echo "=== 本次构建写入的 VERSION ==="
          cat VERSION
          echo "${RUN_META} GIT_SHA=${GIT_SHA}"
          echo "### 🏷️ 构建 VERSION — trading-${{ matrix.service.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- DEPLOY_ID: ${DEPLOY_ID} (${RUN_META})" >> "$GITHUB_STEP_SUMMARY"
          echo "- GIT_SHA: ${GIT_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- DEPLOY_TIME(UTC): ${DEPLOY_TIME}" >> "$GITHUB_STEP_SUMMARY"

      - name: 🔐 登录 GHCR
        if: steps.decide.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build + Push trading-${{ matrix.service.name }}
        if: steps.decide.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/trading-${{ matrix.service.name }}:latest

  # ============================================
  # Job 2: SSH 服务器部署
  # 不管 build 有没有真的构建（可能全 skip），都跑 deploy
  # docker compose pull → 只拉有新版本的 tag
  # docker compose up -d → 只 recreate 镜像变了的容器
  # ============================================
  deploy:
    name: 🚀 SSH 服务器部署
    needs: [detect, build-all]
    if: always() && needs.detect.result == 'success' && (needs.build-all.result == 'success' || needs.build-all.result == 'skipped' || needs.build-all.result == 'cancelled')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🔑 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 43.156.242.184 >> ~/.ssh/known_hosts

          # 写 SSH 客户端配置：Host/User/IdentityFile 与超时加固参数在此统一定义一次。
          # 后续所有 scp/ssh 调用自动继承，无需再显式指定 `-i` 与 `root@`（并非漏写），
          # 既避免重复书写导致静默挂起，也消除了三处调用中 `-i`/`root@` 的冗余。
          cat >> ~/.ssh/config << 'SSH_CONFIG'
          Host 43.156.242.184
            User root
            IdentityFile ~/.ssh/id_rsa
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 3
          SSH_CONFIG
          chmod 600 ~/.ssh/config

          # 写公共重试函数：仅供后续 step 通过 source 复用，避免重复代码。
          # 关键设计：只在 exit 255（连接层失败）时重试；其余 exit code 立即返回。
          # 因为远程部署脚本有真实副作用（pull/up/写部署日志），
          # 对脚本自身失败重试会造成重复部署与审计日志污染，故仅连接失败才重试。
          cat > /tmp/ci_retry.sh << 'RETRY_SH'
          retry_connect() {
            local i rc
            for i in 1 2 3; do
              rc=0
              "$@" || rc=$?
              if [ "$rc" -eq 0 ]; then
                return 0
              fi
              if [ "$rc" -ne 255 ]; then
                echo "❌ 非连接类失败（exit ${rc}），不重试"
                return "$rc"
              fi
              echo "⚠️ 连接失败（exit 255），第 ${i}/3 次，15s 后重试..."
              sleep 15
            done
            echo "❌ 连接重试 3 次仍失败"
            return 255
          }
          RETRY_SH

      - name: 📤 上传 docker-compose.yml（scp）
        run: |
          source /tmp/ci_retry.sh
          retry_connect scp docker-compose.yml 43.156.242.184:/root/trading_system/docker-compose.yml

      - name: 🚀 生成并上传远程部署脚本
        run: |
          cat > /tmp/deploy.sh << 'REMOTE_SCRIPT'
            set -e
            cd /root/trading_system

            echo "========================================"
            echo "CI/CD 自动部署"
            echo "时间: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "========================================"

            # 1. 服务器 GHCR 认证（首次）
            if ! docker image inspect ghcr.io/bearflower/trading-btc-eth:latest >/dev/null 2>&1; then
              echo "🔐 首次登录 GHCR..."
              echo "__GHCR_TOKEN__" | docker login ghcr.io -u bearflower --password-stdin
            fi

            # 2. 仅清理「不属于本 compose 项目」的残留容器（compose.yml 接管前的命名冲突防护）
            # 场景：data-backend / dashboard-api 曾独立 docker run 部署，compose.yml 也定义了同名
            #       → docker compose up 报 "container name already in use" exit 1
            # 判定：容器 ID 是否出现在本项目管辖范围（docker compose ps -a -q）内
            #       在  → 本项目容器，保留（交给 compose up -d 按镜像变化增量 recreate，避免全量停机）
            #       不在 → 独立部署残留，移除
            echo "🧹 清理非本 compose 项目的残留容器..."
            PROJECT_IDS=$(docker compose ps -a -q 2>/dev/null || true)
            RESIDUAL_CANDIDATES="trading_system-postgres trading_system-hrs trading_system-btc_eth \
              trading_system-btc_eth_aggressive trading_system-new_coin trading_system-grid \
              ai-tuner trading_system-kline trading_system-kline-monitor data-backend dashboard-api"
            if [ -z "$PROJECT_IDS" ]; then
              # 未取到本项目容器清单（compose 异常）时不删任何容器：
              # 先删后 up 失败会导致全部服务停机且无替代，宁可让 docker compose up 自己报冲突
              echo "⚠️ 未取到本 compose 项目容器清单，跳过残留清理"
            else
              for name in $RESIDUAL_CANDIDATES; do
                cid=$(docker inspect -f '{{.Id}}' "$name" 2>/dev/null || true)
                if [ -z "$cid" ]; then
                  continue
                fi
                if printf '%s\n' "$PROJECT_IDS" | grep -qx "$cid"; then
                  echo "   - 保留（本 compose 项目）: $name"
                  continue
                fi
                echo "   - 移除独立部署残留: $name"
                docker rm -f "$name" || true
              done
            fi

            # 3. 拉取有新版本的镜像（compose pull 自动对比 registry 标签）
            echo "📥 docker compose pull..."
            docker compose pull

            # 4. 只更新镜像变了的容器（compose up -d 自动检测）
            echo "🔄 docker compose up -d..."
            docker compose up -d --remove-orphans

            # 5. 等容器就绪
            echo "⏳ 等待 15s..."
            sleep 15

            # 6. 状态检查
            echo ""
            echo "✅ 当前容器状态："
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep -E "trading_system|ai-tuner|data-backend|dashboard-api" || echo "⚠️ 未找到 trading 相关容器"

            # 7. 写部署日志
            mkdir -p deploy_logs
            DEPLOY_TIME=$(date "+%Y-%m-%d %H:%M:%S")
            COMMIT_SHA="__COMMIT_SHA__"
            DEPLOY_ID="__DEPLOY_ID__"
            LOG_FILE="deploy_logs/$(date '+%Y%m%d').log"
            LOG_MSG="[${DEPLOY_TIME}] DEPLOY_SUCCESS commit=${COMMIT_SHA} deploy_id=${DEPLOY_ID}"
            echo "${LOG_MSG}" >> "${LOG_FILE}"

            echo ""
            echo "========================================"
            echo "🎉 CI/CD 部署完成！"
            echo "========================================"
          REMOTE_SCRIPT
          sed -i "s|__GHCR_TOKEN__|${{ secrets.GHCR_PULL_TOKEN }}|g" /tmp/deploy.sh
          sed -i "s|__COMMIT_SHA__|${{ github.sha }}|g" /tmp/deploy.sh
          # DEPLOY_ID 与 build 侧同一公式（高 24 位 run_number、低 8 位 run_attempt，可反解），
          # 注入远程脚本，使部署日志中的 deploy_id 可与本次构建的容器一一核对
          DEPLOY_ID=$(printf '%08X' $(( (${{ github.run_number }} << 8) | ${{ github.run_attempt }} )))
          sed -i "s|__DEPLOY_ID__|${DEPLOY_ID}|g" /tmp/deploy.sh
          source /tmp/ci_retry.sh
          retry_connect scp /tmp/deploy.sh 43.156.242.184:/tmp/deploy.sh

      - name: ▶️ 执行远程部署脚本
        run: |
          source /tmp/ci_retry.sh
          retry_connect ssh 43.156.242.184 "bash /tmp/deploy.sh && rm /tmp/deploy.sh"
