name: CI/CD — 构建镜像并自动部署

# ============================================
# Binance 量化交易系统 CI/CD 流水线
# 流程: push → Actions 构建 10 个镜像 → 推送到 GHCR → SSH 服务器 pull + up + 写日志
# ============================================

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'backtest/**'
      - 'tests/**'
      - '.trae/**'
      - '*.md'
  workflow_dispatch:  # 也支持手动触发

# 并发控制：同分支只跑一个
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: bearflower  # GHCR namespace（你的 GitHub 用户名小写）
  GITHUB_SHA_SHORT: ${{ github.sha }}  # 用作镜像 tag
  DEPLOY_ID: ${{ github.run_number }}-${{ github.event.short_sha }}

jobs:
  # ============================================
  # Job 1: 构建全部 10 个镜像并推送 GHCR
  # ============================================
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # 写 GHCR 必需

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: 🔐 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # 自动获取的临时 token，足够 push public 镜像

      - name: 🏗️ 构建并推送镜像（矩阵并行）
        uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 下面是 10 个服务的构建矩阵（用一个 action 循环处理）
          # 用 buildx bake 或逐个 build 都可，这里用逐个 build
        continue-on-error: false

      # —— 逐个构建 10 个服务 ——
      # （上面用了矩阵方式，这里改为逐个 build-push，更清晰）

  # 简化版：逐服务构建
  build-all:
    name: 构建全部 10 个镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: "btc-eth",        context: ".", dockerfile: "strategies/btc_eth/Dockerfile" }
          - { name: "btc-eth-aggr",   context: ".", dockerfile: "strategies/btc_eth_aggressive/Dockerfile" }
          - { name: "new-coin",       context: ".", dockerfile: "strategies/new_coin/Dockerfile" }
          - { name: "grid",           context: ".", dockerfile: "strategies/grid/Dockerfile" }
          - { name: "hrs",            context: ".", dockerfile: "strategies/hrs/Dockerfile" }
          - { name: "kline-service",  context: ".", dockerfile: "services/kline_service/Dockerfile" }
          - { name: "kline-monitor",  context: ".", dockerfile: "services/kline_monitor/Dockerfile" }
          - { name: "ai-tuner",       context: ".", dockerfile: "ai_tuner/Dockerfile" }
          - { name: "data-backend",   context: ".", dockerfile: "services/data_backend/Dockerfile" }
          - { name: "dashboard-api",  context: ".", dockerfile: "dashboard/backend/Dockerfile" }
    steps:
      - uses: actions/checkout@v4

      - name: 🔐 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ 构建并推送 ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/trading-${{ matrix.service.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/trading-${{ matrix.service.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Job 2: SSH 到服务器执行部署
  # 依赖 Job 1 全部完成
  # ============================================
  deploy:
    name: SSH 服务器部署
    needs: build-all
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: 🔑 安装 SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 43.156.242.184 >> ~/.ssh/known_hosts

      - name: 📤 同步部署所需文件到服务器
        run: |
          # 只需 docker-compose.yml + .env + VERSION，代码已在镜像里
          rsync -avz --progress \
            docker-compose.yml \
            .deploy_config \
            VERSION \
            root@43.156.242.184:/root/trading_system/

      - name: 🚀 部署 — pull + up + 写日志
        run: |
          ssh -i ~/.ssh/id_rsa root@43.156.242.184 '
            set -e
            cd /root/trading_system

            echo "========================================"
            echo "CI/CD 自动部署开始"
            echo "时间: $(date "+%Y-%m-%d %H:%M:%S")"
            echo "Git SHA: ${{ github.sha }}"
            echo "部署 ID: ${{ env.DEPLOY_ID }}"
            echo "========================================"

            # 1. 服务器 GHCR 认证（首次或 token 过期时需要）
            # 如果之前没登录过，用 Actions 临时 token 登录
            if ! docker image inspect ghcr.io/bearflower/trading-btc-eth:latest >/dev/null 2>&1; then
              echo "首次部署，登录 GHCR..."
              echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u bearflower --password-stdin
            fi

            # 2. 拉取所有新镜像
            echo ""
            echo "📥 拉取新镜像..."
            docker compose pull

            # 3. 仅重建发生变化的服务（已有镜像不变）
            echo ""
            echo "🔄 滚动更新容器..."
            docker compose up -d --remove-orphans

            # 4. 等待容器就绪
            echo ""
            echo "⏳ 等待容器健康检查..."
            sleep 10

            # 5. 检查所有服务状态
            echo ""
            echo "✅ 容器状态："
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep trading_system\|ai-tuner

            # 6. 写部署日志
            mkdir -p deploy_logs
            DEPLOY_TIME=$(date "+%Y-%m-%d %H:%M:%S")
            DEPLOY_LOG="deploy_logs/$(date "+%Y%m%d").log"
            echo "[${DEPLOY_TIME}] DEPLOY_SUCCESS commit=${{ github.sha }} deploy_id=${{ env.DEPLOY_ID }} triggered_by=${{ github.actor }}" >> "$DEPLOY_LOG"

            echo ""
            echo "========================================"
            echo "🎉 CI/CD 部署完成！"
            echo "日志: /root/trading_system/deploy_logs/"
            echo "========================================"
          '
