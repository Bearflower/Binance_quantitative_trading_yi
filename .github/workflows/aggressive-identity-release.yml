name: Release aggressive decision identity
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: identity-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      RISK_TEST_DSN: postgresql://postgres:identity-test-only@127.0.0.1/risk_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify risk identity on isolated PostgreSQL
        run: |
          pip install -r requirements.txt pytest pytest-asyncio
          PGPASSWORD=identity-test-only psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE risk_tests'
          python -m pytest -q tests/test_risk/test_policy_postgres.py tests/test_risk/test_risk_branches.py tests/test_risk/test_entry_policy.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record immutable revision
        run: echo "GIT_SHA=$GITHUB_SHA" >> VERSION
      - uses: docker/build-push-action@v5
        id: image
        with:
          context: .
          file: deployment/aggressive-identity/Dockerfile
          push: true
          tags: ghcr.io/bearflower/trading-btc-eth-aggr:identity-${{ github.sha }}
      - name: Package exact source proof
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,shutil
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'aggressive-identity'
          paths=('deployment/aggressive-identity/exchange_gate.py',
                 'shared/entry_risk_policy.py','shared/position_ownership.py',
                 'strategies/btc_eth_aggressive/main.py',
                 'strategies/btc_eth_aggressive/strategy.py')
          files={}
          for name in paths:
              path=pathlib.Path(name)
              (target/path).parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(path,target/path)
              files[name]=hashlib.sha256(path.read_bytes()).hexdigest()
          (target/'manifest.json').write_text(json.dumps({'sha':os.environ['GITHUB_SHA'],'files':files},sort_keys=True))
          PY
      - name: Activate reviewed aggressive image
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 43.156.242.184 >> ~/.ssh/known_hosts
          ssh -o ConnectTimeout=15 root@43.156.242.184 "mkdir -p /root/trading_system/.deploy_tmp/aggressive-identity-$GITHUB_SHA"
          tar -C "$RUNNER_TEMP/aggressive-identity" -czf "$RUNNER_TEMP/aggressive-identity.tar.gz" .
          scp -o ConnectTimeout=15 "$RUNNER_TEMP/aggressive-identity.tar.gz" "root@43.156.242.184:/root/trading_system/.deploy_tmp/aggressive-identity-$GITHUB_SHA/bundle.tar.gz"
          ssh -o ConnectTimeout=15 root@43.156.242.184 "tar -xzf /root/trading_system/.deploy_tmp/aggressive-identity-$GITHUB_SHA/bundle.tar.gz -C /root/trading_system/.deploy_tmp/aggressive-identity-$GITHUB_SHA"
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=15 root@43.156.242.184 python3 - "$GITHUB_SHA" "$DIGEST" "/root/trading_system/.deploy_tmp/aggressive-identity-$GITHUB_SHA" < deployment/aggressive-identity/activate.py
