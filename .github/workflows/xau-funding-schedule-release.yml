name: Release XAU funding schedule capture
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify funding and replay timing contracts
        run: |
          pip install -r ai_tuner/requirements.txt pytest pytest-asyncio
          python -m pytest -q tests/test_ai_tuner_mvp/test_funding_schedule*.py tests/test_shadow_replay/test_review_timing.py
          bash -n deployment/xau-funding/activate.sh
      - name: Record image version
        run: printf 'GIT_SHA=%s\n' "$GITHUB_SHA" > VERSION
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        id: image
        with:
          context: .
          file: deployment/xau-funding/Dockerfile
          push: true
          tags: ghcr.io/bearflower/trading-ai-tuner:xau-funding-${{ github.sha }}
      - name: Activate only the funding observer
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 43.156.242.184 >> ~/.ssh/known_hosts
          printf '%s' "$GHCR_PULL_TOKEN" | ssh -o ConnectTimeout=15 root@43.156.242.184 docker login ghcr.io -u bearflower --password-stdin
          collector_sha="$(sha256sum ai_tuner/funding_schedule/collector.py | cut -d ' ' -f 1)"
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=15 root@43.156.242.184 \
            bash -s -- "$GITHUB_SHA" "$DIGEST" "$collector_sha" < deployment/xau-funding/activate.sh
