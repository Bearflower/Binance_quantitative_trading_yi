name: Release nightly exit repair
on:
  push:
    branches: [codex/nightly-exit-repair]
permissions:
  contents: read
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        id: image
        with:
          context: .
          file: deployment/nightly-exit/Dockerfile
          push: true
          tags: ghcr.io/bearflower/trading-ai-tuner:nightly-exit-${{ github.sha }}
      - name: Activate pinned ai-tuner
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 43.156.242.184 >> ~/.ssh/known_hosts
          ssh root@43.156.242.184 python3 - "$GITHUB_SHA" "$DIGEST" < deployment/nightly-exit/activate.py
