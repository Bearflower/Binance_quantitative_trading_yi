name: Release New Coin restart recovery evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify recovered positions stay scoped
        run: |
          pip install -r ai_tuner/requirements.txt pytest pytest-asyncio
          python -m pytest -q tests/test_strategies/test_new_coin_recovery_evidence.py tests/test_strategies/test_new_coin_recovery_identity.py tests/test_strategies/test_new_coin_recovery_proof.py tests/test_strategies/test_new_coin_state_restore.py tests/test_strategies/test_new_coin_tracking_entry.py
      - name: Activate source-only New Coin image
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 43.156.242.184 >> ~/.ssh/known_hosts
          staging="/root/trading_system/.deploy_tmp/new-coin-ownership-$GITHUB_SHA"
          checksum="$(sha256sum strategies/new_coin/strategy.py | cut -d ' ' -f 1)"
          evidence_checksum="$(sha256sum strategies/new_coin/recovery_evidence.py | cut -d ' ' -f 1)"
          ssh -o ConnectTimeout=15 root@43.156.242.184 "install -d -m 700 $staging"
          scp -o ConnectTimeout=15 strategies/new_coin/{strategy.py,recovery_evidence.py} deployment/new-coin-ownership/Dockerfile "root@43.156.242.184:$staging/"
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=15 root@43.156.242.184 python3 - "$GITHUB_SHA" "$checksum" "$evidence_checksum" "$staging" < deployment/new-coin-ownership/activate.py
