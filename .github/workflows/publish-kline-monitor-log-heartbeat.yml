name: Publish kline-monitor log heartbeat

on:
  push:
    tags:
      - kline-monitor-log-heartbeat-20261104
      - kline-monitor-log-heartbeat-latest-20261104

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: services/kline_monitor/src
          file: .github/dockerfiles/kline-monitor-log-heartbeat.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/bearflower/trading-kline-monitor:log-heartbeat-20261104
            ghcr.io/bearflower/trading-kline-monitor:latest
