name: Full regression — build reviewed release images

# This workflow never connects to production and never publishes :latest.
on:
  push:
    branches: [codex/unified-production-20261127]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-regression-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/codex/unified-production-20261127' || github.ref == 'refs/heads/codex/classic-final-release-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: echo "matrix=$(python3 scripts/full_regression_build.py matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Bind build identity
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          printf 'GIT_SHA=%s\nDEPLOY_ID=%08X\nBUILD_RUN_ID=%s\nBUILD_RUN_ATTEMPT=%s\n' \
            "$SOURCE_SHA" "$(( (RUN_NUMBER << 8) | RUN_ATTEMPT ))" "$RUN_ID" "$RUN_ATTEMPT" > VERSION
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build complete source image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bearflower/trading-${{ matrix.name }}:full-regression-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: HRS_IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=full-regression-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=full-regression-${{ matrix.name }}
      - name: Verify imports without network or runtime mounts
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          MODULES: ${{ matrix.modules }}
        run: |
          IMAGE="ghcr.io/bearflower/trading-${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker pull "$IMAGE"
          docker run --rm --network none --read-only --tmpfs /tmp \
            --tmpfs /app/logs:rw,nosuid,nodev,size=16m,mode=1777 \
            -e PYTHONDONTWRITEBYTECODE=1 -e DATABASE_HOST=127.0.0.1 -e DB_HOST=127.0.0.1 \
            --entrypoint python "$IMAGE" -c \
            'import importlib,sys; [importlib.import_module(name) for name in sys.argv[1].split(",")]' "$MODULES"
      - name: Record verified image digest
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 scripts/full_regression_build.py receipt --name "$IMAGE_NAME" --digest "$IMAGE_DIGEST" \
            --sha "$SOURCE_SHA" --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT" --output "receipts/${IMAGE_NAME}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: full-regression-image-${{ matrix.name }}-${{ github.run_attempt }}
          path: receipts/*.json
          if-no-files-found: error

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: full-regression-image-*-${{ github.run_attempt }}
          path: receipts
          merge-multiple: true
      - name: Verify complete digest set and retain source evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 scripts/full_regression_build.py assemble --receipts receipts \
            --sha "$SOURCE_SHA" --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT" --output release/image-digests.json
          printf 'GIT_SHA=%s\nDEPLOY_ID=%08X\nBUILD_RUN_ID=%s\nBUILD_RUN_ATTEMPT=%s\n' \
            "$SOURCE_SHA" "$(( (RUN_NUMBER << 8) | RUN_ATTEMPT ))" "$RUN_ID" "$RUN_ATTEMPT" > VERSION
          python3 scripts/full_regression_build.py sources --output release/source-files.json
          cp VERSION deployment/full-regression/build-plan.json release/
          cp --parents \
            deployment/full-regression/build-plan.json deployment/full-regression/source-mount-removals.json \
            scripts/deploy_full_regression.py scripts/full_regression_build.py \
            scripts/grid_release_guard.py scripts/full_regression_live_gate.py \
            scripts/database_permissions.py database/postgres/permissions.json release/
      - uses: actions/upload-artifact@v4
        with:
          name: full-regression-release-${{ github.sha }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
