name: Build audited classic trading images
on: workflow_dispatch
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.ref == 'refs/heads/codex/classic-trading-build'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: btc-eth-aggr, base: ghcr.io/bearflower/trading-btc-eth-aggr@sha256:860f8ac815a9c3b76bdc4eda8e64226498977fd5eb9b17fb932368cc025ea2b7}
    env:
      SOURCE_SHA: 97b88261e1dc43cb58b336dde51d48fd2db15ccf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Stamp release
        run: |
          printf 'GIT_SHA=%s\nDEPLOY_ID=%08X\n' "$SOURCE_SHA" "$(( (GITHUB_RUN_NUMBER << 8) | GITHUB_RUN_ATTEMPT ))" > VERSION
      - name: Prepare runtime overlay on reviewed production image
        run: |
          git fetch -q --depth=1 origin c30a0bd73e54121e0c85b6a9a88b5849be962af9
          test -z "$(git diff --diff-filter=D --name-only c30a0bd73e54121e0c85b6a9a88b5849be962af9 HEAD -- strategies/btc_eth_aggressive)"
          mkdir -p runtime-layer/overlay
          git diff --name-only c30a0bd73e54121e0c85b6a9a88b5849be962af9 HEAD -- strategies/btc_eth_aggressive | while IFS= read -r file; do cp --parents "$file" runtime-layer/overlay/; done
          cp VERSION runtime-layer/overlay/
          printf '%s\n' 'ARG BASE' 'FROM ${BASE}' 'ARG HRS_IMAGE_REVISION' 'ENV HRS_IMAGE_REVISION=${HRS_IMAGE_REVISION}' 'COPY overlay/ /app/' > runtime-layer/Dockerfile
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        id: build
        with:
          context: runtime-layer
          file: runtime-layer/Dockerfile
          build-args: |
            BASE=${{ matrix.base }}
            HRS_IMAGE_REVISION=${{ env.SOURCE_SHA }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bearflower/trading-${{ matrix.name }}:classic-live-${{ env.SOURCE_SHA }}-r${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "PM image digest $DIGEST" >> "$GITHUB_STEP_SUMMARY"
