name: Build audited grid sizing and rate recovery
on: workflow_dispatch
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.ref == 'refs/heads/codex/classic-trading-build'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - role: signal
            image: trading-grid
            base: ghcr.io/bearflower/trading-grid@sha256:1e36b058152ae2bcdb0b1db07ceb5937921dbfc998d3f95244464e1612c16dfe
          - role: executor
            image: trading-grid
            base: ghcr.io/bearflower/trading-grid@sha256:557a3f0a68a26ef635eb51e38725b2d80a8152bbe953bde57dfef92167dc997a
          - role: hrs
            image: trading-hrs
            base: ghcr.io/bearflower/trading-hrs@sha256:8a245cfa1f92e799ec56986ae8d1c13556fcb9e1cf2a97b7fb07ca3b5c20f399
    env:
      SOURCE_SHA: 30ab34fdbd71dd59029f6e85bf367506f92c0df8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Prepare exact reviewed overlay
        run: |
          mkdir -p runtime-layer/overlay
          cp --parents strategies/grid/execution/engine.py strategies/grid/execution/exchange.py strategies/grid/execution/main.py strategies/grid/execution/planner.py strategies/grid/execution/position_recovery.py strategies/grid/execution/request_budget.py strategies/grid/execution/signal_receipt.py strategies/grid/execution/sizing.py strategies/grid/execution/store.py strategies/grid/execution/trailing.py strategies/grid/execution/trailing_store.py strategies/grid/signal_bot.py runtime-layer/overlay/
          printf 'GIT_SHA=%s\nDEPLOY_ID=%08X\n' "$SOURCE_SHA" "$(( (GITHUB_RUN_NUMBER << 8) | GITHUB_RUN_ATTEMPT ))" > runtime-layer/overlay/VERSION
          printf '%s\n' 'ARG BASE' 'FROM ${BASE}' 'COPY overlay/ /app/' > runtime-layer/Dockerfile
          if [ '${{ matrix.service.role }}' = 'hrs' ]; then
            printf 'ENV HRS_IMAGE_REVISION=%s\n' "$SOURCE_SHA" >> runtime-layer/Dockerfile
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        id: build
        with:
          context: runtime-layer
          file: runtime-layer/Dockerfile
          build-args: BASE=${{ matrix.service.base }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bearflower/${{ matrix.service.image }}:joint-${{ matrix.service.role }}-${{ env.SOURCE_SHA }}-r${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ROLE: ${{ matrix.service.role }}
        run: |
          echo "grid-$ROLE image digest $DIGEST"
          echo "grid-$ROLE image digest $DIGEST" >> "$GITHUB_STEP_SUMMARY"
