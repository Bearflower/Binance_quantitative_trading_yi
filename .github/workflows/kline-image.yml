name: Build audited classic trading images
on: workflow_dispatch
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.ref == 'refs/heads/codex/classic-trading-build'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: data-backend, base: ghcr.io/bearflower/trading-data-backend@sha256:7c316109ee522b91626c19920e2d121ea968b2efee47d7acbec2cbe874e86841}
          - {name: dashboard-api, base: ghcr.io/bearflower/trading-dashboard-api@sha256:ad5ea2bc8ca85be4e22e1497232804208bee27ee84172d09602034a1a8a3e8c3}
          - {name: ai-tuner, base: ghcr.io/bearflower/trading-ai-tuner@sha256:fdbb239a2e6696904a10dc25d9e008fd6d65a7c37086c451da8b71496b42c48e}
          - {name: kline-service, base: ghcr.io/bearflower/trading-kline-service@sha256:8fe70abbfdd327d01d5c8a457d91ca6e165ce0df534338223a4c621852fffea2}
    env:
      SOURCE_SHA: be7484a7f9ef484a79187b801f0a37a6a2bdbe78
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Stamp release
        run: |
          printf 'GIT_SHA=%s\nDEPLOY_ID=%08X\n' "$SOURCE_SHA" "$(( (GITHUB_RUN_NUMBER << 8) | GITHUB_RUN_ATTEMPT ))" > VERSION
      - name: Prepare runtime overlay on reviewed production image
        run: |
          mkdir -p runtime-layer/overlay
          case '${{ matrix.name }}' in
            data-backend|dashboard-api)
              for file in shared/accounting/collector_recovery.py shared/accounting/equity_bridge.py shared/accounting/runtime_cutover.py shared/binance_account_mode.py shared/config_loader.py dashboard/backend/services/data_service_docker.py; do
                cp --parents "$file" runtime-layer/overlay/
              done
              ;;
            ai-tuner) cp --parents shared/config_loader.py runtime-layer/overlay/ ;;
            kline-service)
              mkdir -p runtime-layer/overlay/shared/core
              cp services/kline_service/shared/core/config.py runtime-layer/overlay/shared/core/config.py ;;
          esac
          cp VERSION runtime-layer/overlay/
          printf '%s\n' 'ARG BASE' 'FROM ${BASE}' 'COPY overlay/ /app/' > runtime-layer/Dockerfile
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        id: build
        with:
          context: runtime-layer
          file: runtime-layer/Dockerfile
          build-args: |
            BASE=${{ matrix.base }}
            HRS_IMAGE_REVISION=${{ env.SOURCE_SHA }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bearflower/trading-${{ matrix.name }}:classic-live-${{ env.SOURCE_SHA }}-r${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "PM image digest $DIGEST" >> "$GITHUB_STEP_SUMMARY"
