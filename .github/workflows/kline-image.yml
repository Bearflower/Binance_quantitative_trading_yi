name: Build reviewed PM compatibility images
on: workflow_dispatch
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.ref == 'refs/heads/codex/pm-window-images-89160896'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: btc-eth, dir: strategies/btc_eth}
          - {name: btc-eth-aggr, dir: strategies/btc_eth_aggressive}
          - {name: new-coin, dir: strategies/new_coin}
          - {name: grid, dir: strategies/grid}
          - {name: hrs, dir: strategies/hrs}
          - {name: ai-tuner, dir: ai_tuner}
          - {name: data-backend, dir: services/data_backend}
          - {name: dashboard-api, dir: dashboard/backend}
    env:
      SOURCE_SHA: 89160896bf9cef194adefe74ed2383a47bc77aa6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Stamp release
        run: |
          printf 'GIT_SHA=%s\nDEPLOY_ID=%08X\n' "$SOURCE_SHA" "$(( (GITHUB_RUN_NUMBER << 8) | GITHUB_RUN_ATTEMPT ))" > VERSION
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          file: ${{ matrix.dir }}/Dockerfile
          build-args: HRS_IMAGE_REVISION=${{ env.SOURCE_SHA }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bearflower/trading-${{ matrix.name }}:pm-${{ env.SOURCE_SHA }}-r${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "PM image digest $DIGEST" >> "$GITHUB_STEP_SUMMARY"
