name: Build inspection evidence diagnostics
on: workflow_dispatch
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.ref == 'refs/heads/codex/classic-trading-build'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - role: hrs
            image: trading-hrs
            base: ghcr.io/bearflower/trading-hrs@sha256:1e44aee6a2838badc0a02f5d25ff15d57264120d56a296584d80f55425f9b4d7
          - role: tuner
            image: trading-ai-tuner
            base: ghcr.io/bearflower/trading-ai-tuner@sha256:71beda3a685cd17ce54e7be05d58e30c85c748a9599bda43fe7808934097a2e2
          - role: funding
            image: trading-xau-attribution-funding
            base: ghcr.io/bearflower/trading-xau-attribution-funding@sha256:4b2230fb25a0f5223e338bd2fd5a103c37fb312f345f957a3d7eb2d1d6fb1277
    env:
      SOURCE_SHA: a74901f429762820e6ffdd77329a1caeb337f294
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Prepare exact reviewed overlay
        run: |
          mkdir -p runtime-layer/overlay
          case '${{ matrix.service.role }}' in
            hrs) files='strategies/hrs/decision_context.py ai_tuner/reconciler/income_reconciler.py ai_tuner/funding_schedule/collector.py' ;;
            tuner) files='ai_tuner/reconciler/income_reconciler.py' ;;
            funding) files='ai_tuner/funding_schedule/collector.py' ;;
          esac
          cp --parents $files runtime-layer/overlay/
          printf 'GIT_SHA=%s\nDEPLOY_ID=%08X\n' "$SOURCE_SHA" "$(( (GITHUB_RUN_NUMBER << 8) | GITHUB_RUN_ATTEMPT ))" > runtime-layer/overlay/VERSION
          printf '%s\n' 'ARG BASE' 'FROM ${BASE}' 'COPY overlay/ /app/' > runtime-layer/Dockerfile
          if [ '${{ matrix.service.role }}' = 'hrs' ]; then
            printf 'ENV HRS_IMAGE_REVISION=%s\n' "$SOURCE_SHA" >> runtime-layer/Dockerfile
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        id: build
        with:
          context: runtime-layer
          file: runtime-layer/Dockerfile
          build-args: BASE=${{ matrix.service.base }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bearflower/${{ matrix.service.image }}:inspection-${{ matrix.service.role }}-${{ env.SOURCE_SHA }}-r${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ROLE: ${{ matrix.service.role }}
        run: |
          echo "grid-$ROLE image digest $DIGEST"
          echo "grid-$ROLE image digest $DIGEST" >> "$GITHUB_STEP_SUMMARY"
