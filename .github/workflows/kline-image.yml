name: Build audited classic trading images
on: workflow_dispatch
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.ref == 'refs/heads/codex/classic-trading-build'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: data-backend, base: ghcr.io/bearflower/trading-data-backend@sha256:e1d8a85f05c9b322c5c3c5fb8245b5e60a5abbcfc4f4dac56dd80ae4f1afdae8}
          - {name: dashboard-api, base: ghcr.io/bearflower/trading-dashboard-api@sha256:197e99457a25f96c0dfc5e2ac1c1f53a774b436971d3bdd171f0c1261b16c262}
          - {name: hrs, base: ghcr.io/bearflower/trading-hrs@sha256:81df50a123b526a82cb691e82de2dcb30ed796171b28c7d9ec162bf69cf7ef0c}
    env:
      SOURCE_SHA: 532321e65da07d8ced5b26097f7d5ae10e4ea215
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Stamp release
        run: |
          printf 'GIT_SHA=%s\nDEPLOY_ID=%08X\n' "$SOURCE_SHA" "$(( (GITHUB_RUN_NUMBER << 8) | GITHUB_RUN_ATTEMPT ))" > VERSION
      - name: Prepare runtime overlay on reviewed production image
        run: |
          mkdir -p runtime-layer/overlay
          case '${{ matrix.name }}' in
            data-backend)
              for file in dashboard/backend/core/config.py dashboard/backend/config.yaml; do cp --parents "$file" runtime-layer/overlay/; done ;;
            dashboard-api) cp --parents dashboard/backend/core/config.py runtime-layer/overlay/ ;;
            hrs)
              for file in shared/config_loader.py strategies/hrs/decision_context.py; do cp --parents "$file" runtime-layer/overlay/; done ;;
          esac
          cp VERSION runtime-layer/overlay/
          printf '%s\n' 'ARG BASE' 'FROM ${BASE}' 'ARG HRS_IMAGE_REVISION' 'ENV HRS_IMAGE_REVISION=${HRS_IMAGE_REVISION}' 'COPY overlay/ /app/' > runtime-layer/Dockerfile
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        id: build
        with:
          context: runtime-layer
          file: runtime-layer/Dockerfile
          build-args: |
            BASE=${{ matrix.base }}
            HRS_IMAGE_REVISION=${{ env.SOURCE_SHA }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bearflower/trading-${{ matrix.name }}:classic-live-${{ env.SOURCE_SHA }}-r${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "PM image digest $DIGEST" >> "$GITHUB_STEP_SUMMARY"
