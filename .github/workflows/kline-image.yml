name: Build audited classic trading images
on: workflow_dispatch
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.ref == 'refs/heads/codex/classic-trading-build'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: btc-eth, base: ghcr.io/bearflower/trading-btc-eth@sha256:0709b21f66f494411f926f71d7383abe452355630b4580d021158fe1711b06a8}
          - {name: hrs, base: ghcr.io/bearflower/trading-hrs@sha256:2139d33bcd9240caa4bc88fd099340dced1af1e8e980e1ae643126738f49378c}
          - {name: new-coin, base: ghcr.io/bearflower/trading-new-coin@sha256:d1a2e1c7c2f21853ef6de4f1bb34ec857eda8336a1dca192731d5ef140443f18}
          - {name: ai-tuner, base: ghcr.io/bearflower/trading-ai-tuner@sha256:a96e63fa7f7187504f3fd9a6d0a1922afccf80c2456858efe5d6877aabfec8af}
    env:
      SOURCE_SHA: 153809d12124c91f9921d82de82f7a70695acfd9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Stamp release
        run: |
          printf 'GIT_SHA=%s\nDEPLOY_ID=%08X\n' "$SOURCE_SHA" "$(( (GITHUB_RUN_NUMBER << 8) | GITHUB_RUN_ATTEMPT ))" > VERSION
      - name: Prepare runtime overlay on reviewed production image
        run: |
          git fetch -q --depth=1 origin c30a0bd73e54121e0c85b6a9a88b5849be962af9
          test -z "$(git diff --diff-filter=D --name-only c30a0bd73e54121e0c85b6a9a88b5849be962af9 HEAD -- shared/binance_account_mode.py scripts/cutover_income_timer.py strategies/btc_eth/Dockerfile strategies/new_coin/Dockerfile ai_tuner/Dockerfile)"
          mkdir -p runtime-layer/overlay
          git diff --name-only c30a0bd73e54121e0c85b6a9a88b5849be962af9 HEAD -- shared/binance_account_mode.py scripts/cutover_income_timer.py strategies/btc_eth/Dockerfile strategies/new_coin/Dockerfile ai_tuner/Dockerfile | while IFS= read -r file; do cp --parents "$file" runtime-layer/overlay/; done
          mkdir -p runtime-layer/overlay/strategies
          cp -a strategies/hrs runtime-layer/overlay/strategies/
          cp VERSION runtime-layer/overlay/
          printf '%s\n' 'ARG BASE' 'FROM ${BASE}' 'ARG HRS_IMAGE_REVISION' 'ENV HRS_IMAGE_REVISION=${HRS_IMAGE_REVISION}' 'COPY overlay/ /app/' > runtime-layer/Dockerfile
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        id: build
        with:
          context: runtime-layer
          file: runtime-layer/Dockerfile
          build-args: |
            BASE=${{ matrix.base }}
            HRS_IMAGE_REVISION=${{ env.SOURCE_SHA }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bearflower/trading-${{ matrix.name }}:classic-live-${{ env.SOURCE_SHA }}-r${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "PM image digest $DIGEST" >> "$GITHUB_STEP_SUMMARY"
