name: Build scoped executor reconciliation hotfix
on: workflow_dispatch
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.ref == 'refs/heads/codex/grid-reconcile-build-20261127'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - role: executor
            image: trading-grid
            base: ghcr.io/bearflower/trading-grid@sha256:c803706a1cba217f62671909ca643d44bded9797db38b614aad8d6ec70a455b4
    env:
      SOURCE_SHA: c847843cb5aabf8c088073776b8457ba3f6f8b43
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Prepare exact reviewed overlay
        run: |
          mkdir -p runtime-layer/overlay
          cp --parents strategies/grid/execution/engine.py runtime-layer/overlay/
          printf 'GIT_SHA=%s\nDEPLOY_ID=%08X\n' "$SOURCE_SHA" "$(( (GITHUB_RUN_NUMBER << 8) | GITHUB_RUN_ATTEMPT ))" > runtime-layer/overlay/VERSION
          printf '%s\n' 'ARG BASE' 'FROM ${BASE}' 'COPY overlay/ /app/' > runtime-layer/Dockerfile
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        id: build
        with:
          context: runtime-layer
          file: runtime-layer/Dockerfile
          build-args: BASE=${{ matrix.service.base }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bearflower/${{ matrix.service.image }}:reconcile-${{ matrix.service.role }}-${{ env.SOURCE_SHA }}-r${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ROLE: ${{ matrix.service.role }}
        run: |
          echo "grid-$ROLE image digest $DIGEST"
          echo "grid-$ROLE image digest $DIGEST" >> "$GITHUB_STEP_SUMMARY"
