name: Build audited classic trading images
on: workflow_dispatch
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.ref == 'refs/heads/codex/classic-trading-build'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: btc-eth-aggr, base: ghcr.io/bearflower/trading-btc-eth-aggr@sha256:e0596f41f15377456552dc94df70545bdf25b16ba118e8249553ada5bcce6eba}
          - {name: grid, base: ghcr.io/bearflower/trading-grid@sha256:473b2fb38d0e3c1017f8e6ab68f1ffda9f3e5c852ee473c99b9c3af8315aa213}
    env:
      SOURCE_SHA: ca19a098e267192aa955400c3fd78f80dc286325
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Stamp release
        run: |
          printf 'GIT_SHA=%s\nDEPLOY_ID=%08X\n' "$SOURCE_SHA" "$(( (GITHUB_RUN_NUMBER << 8) | GITHUB_RUN_ATTEMPT ))" > VERSION
      - name: Prepare runtime overlay on reviewed production image
        run: |
          mkdir -p runtime-layer/overlay
          cp --parents shared/binance_account_mode.py runtime-layer/overlay/
          cp VERSION runtime-layer/overlay/
          printf '%s\n' 'ARG BASE' 'FROM ${BASE}' 'COPY overlay/ /app/' > runtime-layer/Dockerfile
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        id: build
        with:
          context: runtime-layer
          file: runtime-layer/Dockerfile
          build-args: BASE=${{ matrix.base }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bearflower/trading-${{ matrix.name }}:classic-live-${{ env.SOURCE_SHA }}-r${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "PM image digest $DIGEST" >> "$GITHUB_STEP_SUMMARY"
