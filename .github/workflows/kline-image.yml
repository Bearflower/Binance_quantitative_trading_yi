name: Build audited grid sizing and rate recovery
on: workflow_dispatch
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.ref == 'refs/heads/codex/classic-trading-build'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - role: signal
            image: trading-grid
            base: ghcr.io/bearflower/trading-grid@sha256:d22979bb57567be960b53fb1961a2d5d418409c5beb250a223f98a84406e858a
          - role: executor
            image: trading-grid
            base: ghcr.io/bearflower/trading-grid@sha256:9ccdb3554fcae42f75cd2bb08810ca37c67f183af16b1448ab2b135e67997bd7
          - role: hrs
            image: trading-hrs
            base: ghcr.io/bearflower/trading-hrs@sha256:83f174679b47dbbb1a4d88335af4cbb793552a01ca994019d2ecf751429472ef
    env:
      SOURCE_SHA: bf01d948cdac85bbc4af14037a6c225e58ac801d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Prepare exact reviewed overlay
        run: |
          mkdir -p runtime-layer/overlay
          cp --parents strategies/grid/execution/engine.py strategies/grid/execution/exchange.py strategies/grid/execution/main.py strategies/grid/execution/request_budget.py runtime-layer/overlay/
          printf 'GIT_SHA=%s\nDEPLOY_ID=%08X\n' "$SOURCE_SHA" "$(( (GITHUB_RUN_NUMBER << 8) | GITHUB_RUN_ATTEMPT ))" > runtime-layer/overlay/VERSION
          printf '%s\n' 'ARG BASE' 'FROM ${BASE}' 'COPY overlay/ /app/' > runtime-layer/Dockerfile
          if [ '${{ matrix.service.role }}' = 'hrs' ]; then
            printf 'ENV HRS_IMAGE_REVISION=%s\n' "$SOURCE_SHA" >> runtime-layer/Dockerfile
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        id: build
        with:
          context: runtime-layer
          file: runtime-layer/Dockerfile
          build-args: BASE=${{ matrix.service.base }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bearflower/${{ matrix.service.image }}:joint-${{ matrix.service.role }}-${{ env.SOURCE_SHA }}-r${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ROLE: ${{ matrix.service.role }}
        run: |
          echo "grid-$ROLE image digest $DIGEST"
          echo "grid-$ROLE image digest $DIGEST" >> "$GITHUB_STEP_SUMMARY"
