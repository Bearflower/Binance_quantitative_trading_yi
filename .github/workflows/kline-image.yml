name: Build audited startup rejection recovery
on: workflow_dispatch
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.ref == 'refs/heads/codex/classic-trading-build'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - role: executor
            image: trading-grid
            base: ghcr.io/bearflower/trading-grid@sha256:0ed01fd9e7becba2620b0f27796763fa7c3d6b9da576b3c6684f0e2dd703e630
          - role: signal
            image: trading-grid
            base: ghcr.io/bearflower/trading-grid@sha256:620dbd4452cb0b70301279d4f100a2b90175f877ee7345064496dd91b53c7cf8
          - role: hrs
            image: trading-hrs
            base: ghcr.io/bearflower/trading-hrs@sha256:b7250bb62903567ddfd642ece75a0147c6f8ae647e9bbdbfc6781b10cc1d93ac
    env:
      SOURCE_SHA: 3ba21646090d11da00017c84d9206053d1045e35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Prepare exact reviewed overlay
        run: |
          mkdir -p runtime-layer/overlay
          cp --parents strategies/grid/execution/engine.py strategies/grid/execution/exchange.py strategies/grid/execution/store.py strategies/grid/execution/startup_recovery.py runtime-layer/overlay/
          printf 'GIT_SHA=%s\nDEPLOY_ID=%08X\n' "$SOURCE_SHA" "$(( (GITHUB_RUN_NUMBER << 8) | GITHUB_RUN_ATTEMPT ))" > runtime-layer/overlay/VERSION
          printf '%s\n' 'ARG BASE' 'FROM ${BASE}' 'COPY overlay/ /app/' > runtime-layer/Dockerfile
          if [ '${{ matrix.service.role }}' = 'hrs' ]; then
            printf 'ENV HRS_IMAGE_REVISION=%s\n' "$SOURCE_SHA" >> runtime-layer/Dockerfile
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        id: build
        with:
          context: runtime-layer
          file: runtime-layer/Dockerfile
          build-args: BASE=${{ matrix.service.base }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bearflower/${{ matrix.service.image }}:startup-${{ matrix.service.role }}-${{ env.SOURCE_SHA }}-r${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ROLE: ${{ matrix.service.role }}
        run: |
          echo "grid-$ROLE image digest $DIGEST"
          echo "grid-$ROLE image digest $DIGEST" >> "$GITHUB_STEP_SUMMARY"
