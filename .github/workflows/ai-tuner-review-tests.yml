name: AI Tuner regression tests
on:
  pull_request:
    paths:
      - 'ai_tuner/**'
      - 'shared/**'
      - 'strategies/**'
      - 'tests/test_ai_tuner_mvp/**'
      - 'requirements.txt'
      - '.github/workflows/ai-tuner-review-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r ai_tuner/requirements.txt
      - run: python -m pytest --import-mode=importlib -q ai_tuner tests/test_ai_tuner_mvp
