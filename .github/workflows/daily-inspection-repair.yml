name: Scoped daily inspection repair
on:
  push:
    tags: ['inspection-repair-20261125-*']
permissions:
  contents: read
concurrency: daily-inspection-repair
jobs:
  verify-and-activate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify inspection and shadow scheduler
        run: |
          pip install -r requirements.txt
          pip install pytest-asyncio==0.23.8
          python -m pytest -q tests/test_ai_tuner_mvp/test_hrs_minimum_policy_inspection.py tests/test_ai_tuner_mvp/test_hrs_acceptance_scope.py tests/test_strategies/test_shadow_collector.py
      - name: Activate the two verified readers
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cp release/hrs-observer/known_hosts ~/.ssh/known_hosts
          stage="/root/trading_system/.releases/daily-inspection-$GITHUB_SHA"
          target=root@43.156.242.184
          git archive -o "$RUNNER_TEMP/inspection.tar.gz" HEAD release/daily-inspection/activate.py ai_tuner/ops/hrs_acceptance.py strategies/btc_eth/shadow/main.py scripts/database_permissions.py database/postgres/permissions.json
          sha=$(sha256sum "$RUNNER_TEMP/inspection.tar.gz" | cut -d' ' -f1)
          ssh "$target" "umask 077; mkdir -p '$stage'"
          scp "$RUNNER_TEMP/inspection.tar.gz" "$target:$stage/source.tar.gz"
          ssh "$target" "cd '$stage' && echo '$sha  source.tar.gz' | sha256sum -c - && tar xzf source.tar.gz && python3 release/daily-inspection/activate.py '$stage'"
