name: XAU attribution scoped release

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: xau-attribution-scoped-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused regression gate
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q tests/test_scripts/test_xau_attribution_release.py tests/test_scripts/test_xau_exact_release.py tests/test_ai_tuner_mvp/test_funding_schedule*.py tests/test_strategies/test_shadow_collector.py tests/test_strategies/test_shadow_no_trading_write.py tests/test_strategies/test_shadow_image_dependencies.py tests/test_shadow_replay/test_entry_intent.py tests/test_shadow_replay/test_durable_ledger.py tests/test_strategies/test_xau_startup_cutover.py tests/test_strategies/test_xau_entry_intent.py tests/test_strategies/test_xau_version_provenance.py
      - name: Stamp build provenance and file manifest
        env:
          RELEASE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p release-package
          python - <<'PY'
          import hashlib, importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('release', 'deployment/xau-attribution/activate.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          deploy_id = f"{(int(os.environ['RUN_NUMBER']) << 8) | int(os.environ['RUN_ATTEMPT']):08X}"
          sha = os.environ['RELEASE_SHA']
          Path('VERSION').write_text(f'GIT_COMMIT={sha}\nGIT_SHA={sha}\nDEPLOY_ID={deploy_id}\nSHADOW_BASE={mod.BASES["shadow"]}\n')
          manifest = {'git_sha': sha, 'deploy_id': deploy_id, 'files': {
              group: {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths}
              for group, paths in mod.FILES.items()}, 'audit_files': {
              path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in mod.AUDIT_FILES}}
          Path('release-package/hashes.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          cp deployment/xau-attribution/activate.py release-package/activate.py
          cp scripts/database_permissions.py database/postgres/permissions.json release-package/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build shadow thin layer
        id: shadow
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/xau-attribution/Dockerfile.shadow
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bearflower/trading-xau-attribution-shadow:${{ github.sha }}
      - name: Pin built digests
        env:
          SHADOW_DIGEST: ${{ steps.shadow.outputs.digest }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('release-package/digests.json').write_text(json.dumps({
              group: f'ghcr.io/bearflower/trading-xau-attribution-{group}@{os.environ[group.upper() + "_DIGEST"]}'
              for group in ['shadow']}, indent=2) + '\n')
          PY
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Verified existing production host key; never trust a fresh network scan.
          printf '%s\n' '43.156.242.184 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFNCPR4nqDmkewu2141YjcAEiP/PD+cBEXMZKWDcAlSu' > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host 43.156.242.184
            User root
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config
      - name: Remote GHCR login
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -o pipefail
          printf '%s' "$GHCR_PULL_TOKEN" | ssh 43.156.242.184 'docker login ghcr.io -u bearflower --password-stdin'
      - name: Activate only the two XAU shadows
        env:
          PACKAGE: /root/trading_system/.deploy_tmp/xau-attribution-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ssh 43.156.242.184 "install -d -m 700 '$PACKAGE'"
          scp release-package/* "43.156.242.184:$PACKAGE/"
          ssh 43.156.242.184 "python3 '$PACKAGE/activate.py' --package '$PACKAGE'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xau-attribution-provenance
          path: release-package/
