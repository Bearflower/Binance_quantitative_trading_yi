name: Build server inspection repairs
on:
  push:
    branches: [codex/server-inspection-fix-20261128]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-inspection-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/codex/server-inspection-fix-20261128'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: echo "matrix=$(python3 scripts/server_inspection_release.py matrix)" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare exact overlay
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          deploy_id=$(printf '%08X' "$(( (RUN_NUMBER << 8) | RUN_ATTEMPT ))")
          python3 scripts/server_inspection_release.py prepare --name '${{ matrix.name }}' \
            --output '.inspection-build/${{ matrix.name }}' --source "$SOURCE_SHA" --deploy-id "$deploy_id"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .inspection-build/${{ matrix.name }}
          file: .inspection-build/${{ matrix.name }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.repository }}:inspection-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
      - name: Verify source and imports without network
        run: |
          python3 scripts/server_inspection_release.py finish-build \
            --receipt '.inspection-build/${{ matrix.name }}/receipt.json' \
            --image '${{ matrix.repository }}@${{ steps.image.outputs.digest }}'
      - uses: actions/upload-artifact@v4
        with:
          name: server-inspection-${{ matrix.name }}
          path: .inspection-build/${{ matrix.name }}/receipt.json
          if-no-files-found: error
  bundle:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: server-inspection-*
          path: receipts
      - name: Bind release bundle to source
        run: |
          python3 scripts/server_inspection_release.py bundle --receipts receipts \
            --output release --source '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        with:
          name: server-inspection-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
