name: Dashboard Classic segments
on:
  push:
    branches: [codex/dashboard-classic-segments-20261127]
permissions:
  contents: read
  packages: write
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Bind release revision
        run: |
          printf 'GIT_SHA=%s\nDEPLOY_ID=%08X\nBUILD_RUN_ID=%s\nBUILD_RUN_ATTEMPT=%s\n' \
            "$GITHUB_SHA" "$(( (GITHUB_RUN_NUMBER << 8) | GITHUB_RUN_ATTEMPT ))" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > VERSION
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: .
          file: dashboard/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bearflower/trading-dashboard-api:classic-segments-${{ github.sha }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=full-regression-dashboard-api
      - name: Verify pinned image import
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="ghcr.io/bearflower/trading-dashboard-api@${DIGEST}"
          docker pull "$image"
          docker run --rm --network none --entrypoint python "$image" -c 'import main_docker'
          printf '%s\n' "$image" | tee image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-image
          path: image.txt
          if-no-files-found: error
