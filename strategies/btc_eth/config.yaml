binance:
  leverage:
    S: 5
    A: 4
    B: 3
    C: 2

  position_ratio:
    S: 0.50
    A: 0.30
    B: 0.15
    C: 0.05

  order_optimization:
    use_limit_order: true
    use_buy_one_price: true
    use_sell_one_price: true

# 通知配置
notification:
  enabled: true
  levels:
    - info
    - warning
    - error