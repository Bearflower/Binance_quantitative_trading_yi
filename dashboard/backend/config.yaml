# Dashboard 配置文件

# 应用配置
app:
  version: "1.0.0"           # 应用版本号
  timezone_offset: 8         # 时区偏移量（北京时间 UTC+8）

# API 服务配置
api:
  host: "0.0.0.0"
  port: 8000
  debug: false
  cors_origins:
    - "*"

# 缓存配置
cache:
  enabled: true
  ttl_daily: 60         # 日报缓存 1 分钟（实时化后缩短）
  ttl_weekly: 180       # 周报缓存 3 分钟
  ttl_monthly: 300      # 月报缓存 5 分钟
  ttl_metadata: 86400   # 元数据缓存 24 小时

# 数据库配置（从环境变量读取）
database:
  host: "${DB_HOST:localhost}"
  port: "${DB_PORT:5432}"
  database: "${DB_NAME:trading}"
  user: "${DB_USER:postgres}"
  password: "${DB_PASSWORD}"
  min_pool_size: 5
  max_pool_size: 20

# Binance API 配置（从环境变量读取）
binance:
  api_key: "${BINANCE_API_KEY}"
  api_secret: "${BINANCE_API_SECRET}"
  testnet: false

# 策略配置
strategies:
  btc_eth:
    name: "MTPCS策略"
    emoji: "📈"
    symbols:
      - "BTCUSDT"
      - "ETHUSDT"
      - "BNBUSDT"
      - "XRPUSDT"
      - "SOLUSDT"
      - "TRXUSDT"

  new_coin:
    name: "新币做空策略"
    emoji: "📉"
    symbols: []

  hrs:
    name: "HRS策略"
    emoji: "🔄"
    symbols: []

# 日志配置
logging:
  level: "INFO"
  format: "json"
  output: "stdout"
