version: '3.8'

services:
  grid-trading:
    build: .
    image: grid-trading-system:latest
    container_name: grid-trading-system
    restart: unless-stopped
    
    # 环境变量
    env_file:
      - config/.env
    
    # 挂载卷
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    
    # 时区设置
    environment:
      - TZ=Asia/Shanghai
    
    # 网络配置
    networks:
      - grid-network
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

# 网络配置
networks:
  grid-network:
    driver: bridge
