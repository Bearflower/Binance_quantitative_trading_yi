# 网格交易信号灯系统 V2.0 配置文件

# ==================== 交易配置 ====================
trading:
  symbol: "ETHUSDT"  # 交易对（从BTC切换到ETH，利润率更稳定）
  leverage: 10  # 杠杆倍数（建议值，用户可在币安界面调整）
  total_investment: 500  # 总投资金额 USDT（建议值）

# ==================== 策略参数 ====================
strategy:
  # 网格参数
  grid:
    base_grid_count: 15  # 基准网格数量（从20降低到15，提高利润率）
    min_grid_count: 4    # 最小网格数量（从5降低到4，确保利润率达标）
    max_grid_count: 30   # 最大网格数量（从50降低到30，控制资金需求）
    min_profit_rate: 0.01  # 每格最小利润率 1%（币安要求）
    
  # 技术指标参数
  indicators:
    adx_period: 14           # ADX 周期
    adx_weak_threshold: 20   # ADX 弱趋势阈值
    adx_trend_threshold: 25  # ADX 趋势确认阈值
    adx_strong_threshold: 40 # ADX 强趋势暂停阈值
    ema_fast_period: 20      # 快线 EMA 周期
    ema_slow_period: 50      # 慢线 EMA 周期
    atr_period: 14           # ATR 周期
    atr_smoothing: 14        # ATR 平滑周期
    base_atr_window: 90      # 基准 ATR 计算窗口（天）
    
  # 网格宽度倍数
  grid_width:
    ranging_upper: 4.0     # 震荡上边界：价格 + 4×ATR（从3.0提高到4.0，确保利润率达标）
    ranging_lower: 4.0     # 震荡下边界：价格 - 4×ATR（从3.0提高到4.0，确保利润率达标）
    uptrend_upper: 4.0     # 上升趋势上边界：价格 + 4×ATR
    uptrend_lower: 1.5     # 上升趋势下边界：价格 - 1.5×ATR
    downtrend_upper: 1.5   # 下降趋势上边界：价格 + 1.5×ATR
    downtrend_lower: 4.0   # 下降趋势下边界：价格 - 4×ATR
    terminate_buffer: 2.0  # 终止价格缓冲：边界 ± 2×ATR
    
  # 移动止盈参数
  trailing_profit:
    start_threshold: 0.15  # 启动阈值：盈利 ≥ 15%
    retrace_ratio: 0.05    # 回撤比例：从峰值回撤 5% 触发
    
  # 风险管理
  risk:
    hard_stop_loss: -0.08  # 硬止损：总亏损 ≥ 8%

# ==================== 触发条件 ====================
triggers:
  grid_width_change: 0.05      # 网格宽度变化 > 5%
  grid_count_change: 0.10      # 网格数量变化 > 10%
  atr_change: 0.20             # ATR 变化 > 20%
  profit_rate_warning: 0.012   # 每格利润率 < 1.2% 时警告

# ==================== 多时间框架确认 ====================
multi_timeframe:
  enabled: true
  primary_interval: "1h"   # 主判断周期
  confirm_interval: "4h"   # 趋势过滤周期
  require_confirmation: true  # 是否需要多时间框架确认

# ==================== 巡检配置 ====================
inspection:
  interval_minutes: 60  # 巡检间隔（分钟）
  avoid_peak_hours: true  # 是否避开整点高峰

# ==================== 服务配置 ====================
services:
  kline:
    url: "${KLINE_SERVICE_URL}"  # K 线服务地址
    timeout: 10  # 请求超时（秒）
    
  notification:
    url: "${NOTIFICATION_SERVICE_URL}"  # 推送服务地址
    project: "grid"  # 项目标识
    timeout: 10  # 请求超时（秒）

# ==================== 数据库配置 ====================
database:
  url: "${DATABASE_URL}"  # 数据库连接 URL
  pool_size: 5  # 连接池大小
  max_overflow: 10  # 最大溢出连接数

# ==================== 日志配置 ====================
logging:
  level: "INFO"  # 日志级别：DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  file: "logs/grid_signal_bot.log"  # 日志文件路径
  max_bytes: 10485760  # 日志文件最大大小（10MB）
  backup_count: 5  # 日志文件备份数量
