version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: grid-signal-bot:latest
    container_name: grid-signal-bot-app
    restart: unless-stopped
    env_file:
      - config/.env
    environment:
      - DATABASE_URL=postgresql://grid_user:grid_password_2024@postgres:5432/grid_signal_bot
      - TZ=Asia/Shanghai
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
    depends_on:
      - postgres
    networks:
      - trading-network

  postgres:
    image: postgres:15-alpine
    container_name: grid-signal-bot-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=grid_user
      - POSTGRES_PASSWORD=grid_password_2024
      - POSTGRES_DB=grid_signal_bot
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - trading-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grid_user -d grid_signal_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  trading-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
