version: '3.8'

services:
  app:
    build: .
    container_name: stockfilter-app
    working_dir: /app
    environment:
      - TZ=Asia/Shanghai
      - FEISHU_WEBHOOK=${FEISHU_WEBHOOK}
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=stockfilter
      - DB_USER=stockfilter_user
      - DB_PASSWORD=Stock@2024
      - DB_SCHEMA=schema_stockfilter
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    volumes:
      - ./logs:/app/logs
      - ./output:/app/output
      - ./config.yaml:/app/config.yaml:ro
    networks:
      - stock-network
    restart: unless-stopped
    command: >
      sh -c 'echo "等待数据库启动...";
             sleep 5;
             echo "检查 PostgreSQL 数据库状态...";
             has_stocks=$$(python -c "import os; os.environ[\"DB_HOST\"]=\"postgres-db\"; os.environ[\"DB_PORT\"]=\"5432\"; os.environ[\"DB_NAME\"]=\"stockfilter\"; os.environ[\"DB_USER\"]=\"stockfilter_user\"; os.environ[\"DB_PASSWORD\"]=\"Stock@2024\"; os.environ[\"DB_SCHEMA\"]=\"schema_stockfilter\"; from data.database import DatabaseManager; db = DatabaseManager(); stocks = db.get_stock_list(); db.close(); print(len(stocks) if stocks else 0)" 2>/dev/null || echo "0");
             if [ "$$has_stocks" = "0" ] || [ -z "$$has_stocks" ]; then
               echo "数据库为空或无股票数据，开始初始化...";
               python main.py --init && echo "初始化完成！数据已保存到 PostgreSQL";
             else
               echo "数据库已有股票数据（$$has_stocks 只），跳过初始化";
             fi;
             echo "进入定时任务模式（每天 07:30 UTC 执行，对应北京时间 15:30）...";
             while true; do
               now=$$(date -u +"%H:%M");
               if [ "$$now" = "07:30" ]; then
                 echo "执行定时扫描任务（北京时间 15:30）...";
                 python main.py --scan;
                 sleep 60;
               else
                 sleep 30;
               fi;
             done'

networks:
  stock-network:
    external: true
    name: stockfilter_stock-network
