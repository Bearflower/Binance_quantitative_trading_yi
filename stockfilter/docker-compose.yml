version: '3.8'

services:
  app:
    build: .
    container_name: stockfilter-app
    working_dir: /app
    environment:
      - TZ=Asia/Shanghai
      - FEISHU_WEBHOOK=${FEISHU_WEBHOOK}
      - DB_HOST=10.3.0.12
      - DB_PORT=5432
      - DB_NAME=stockfilter
      - DB_USER=stockfilter_user
      - DB_PASSWORD=Stock@2024
      - DB_SCHEMA=schema_stockfilter
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    volumes:
      - ./logs:/app/logs
      - ./output:/app/output
      - ./data:/app/data:ro
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    command: >
      sh -c 'echo "检查 PostgreSQL 数据库状态...";
             has_stocks=$$(python -c "import os; os.environ[\"DB_HOST\"]=\"10.3.0.12\"; os.environ[\"DB_PORT\"]=\"5432\"; os.environ[\"DB_NAME\"]=\"stockfilter\"; os.environ[\"DB_USER\"]=\"stockfilter_user\"; os.environ[\"DB_PASSWORD\"]=\"Stock@2024\"; os.environ[\"DB_SCHEMA\"]=\"schema_stockfilter\"; from data.database import DatabaseManager; db = DatabaseManager(); stocks = db.get_stock_list(); db.close(); print(len(stocks) if stocks else 0)" 2>/dev/null || echo "0");
             has_klines_stocks=$$(python -c "import os; os.environ[\"DB_HOST\"]=\"10.3.0.12\"; os.environ[\"DB_PORT\"]=\"5432\"; os.environ[\"DB_NAME\"]=\"stockfilter\"; os.environ[\"DB_USER\"]=\"stockfilter_user\"; os.environ[\"DB_PASSWORD\"]=\"Stock@2024\"; os.environ[\"DB_SCHEMA\"]=\"schema_stockfilter\"; from data.database import DatabaseManager; import pandas as pd; db = DatabaseManager(); df = pd.read_sql_query(\"SELECT COUNT(DISTINCT code) as cnt FROM klines\", db.conn); db.close(); print(df[\"cnt\"].iloc[0] if len(df) > 0 else 0)" 2>/dev/null || echo "0");
             
             # 检查股票数量是否达到 3000 只，如果没有则先同步最近 250 天
             if [ "$$has_klines_stocks" -lt 3000 ] 2>/dev/null; then
               echo "数据库 K 线数据不完整（$$has_klines_stocks 只股票 < 3000 只），开始同步最近 250 天数据...";
               python sync_kline_history.py --days 250 --stocks 200;
             fi;
             
             echo "";
            echo "进入定时任务模式...";
            echo "- 每日 14:00 UTC (22:00 北京) 执行 K 线更新 + 形态扫描";
            echo "- 每日 00:10 UTC (08:10 北京) 执行飞书推送";
            echo "- 每日 02:00 UTC (10:00 北京) 执行历史数据补全（后台任务）";
            while true; do
              now=$$(date -u +"%H:%M");
              if [ "$$now" = "14:00" ]; then
                echo "";
                echo "========================================";
                echo "执行 K 线更新任务（北京时间 22:00）...";
                echo "========================================";
                python update_kline_daily.py;
                echo "";
                echo "========================================";
                echo "执行形态扫描任务（北京时间 22:00）...";
                echo "========================================";
                python daily_scan.py;
                sleep 60;
              elif [ "$$now" = "00:10" ]; then
                echo "";
                echo "========================================";
                echo "执行飞书推送任务（北京时间 08:10）...";
                echo "========================================";
                python feishu_push.py;
                sleep 60;
              elif [ "$$now" = "02:00" ]; then
                echo "";
                echo "========================================";
                echo "执行历史数据补全任务（北京时间 10:00）...";
                echo "========================================";
                python sync_kline_history.py --days 250 --stocks 200;
                sleep 60;
              else
                sleep 30;
              fi;
            done'
