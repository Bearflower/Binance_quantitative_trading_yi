version: '3.8'

services:
  binance-trade-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: binance-trade-analyzer
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./database:/app/database
      - ./core:/app/core
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    networks:
      - postgres_trading-network
    # 健康检查
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  postgres_trading-network:
    external: true
