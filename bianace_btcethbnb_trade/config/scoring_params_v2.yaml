# 评分系统配置 v2 (v5.5 优化版)
# 基于回测反馈的优化配置

scoring:
  # ========== 优化后的权重配置 ==========
  weights:
    trend: 25       # 从 30 降至 25（减少 EMA 方向依赖）
    pattern: 35     # 从 30 升至 35（提高形态权重）
    momentum: 20    # 不变
    risk: 20        # 不变
  
  # ========== 降低后的等级阈值 ==========
  grade_thresholds:
    S: 70           # 从 85 降至 70（增加信号数量）
    A: 60           # 从 70 降至 60
  
  # ========== 放宽的一票否决阈值 ==========
  veto:
    max_funding_rate: 0.001       # 从 0.08% 放宽至 0.1%
    max_volatility: 0.07          # 从 6% 放宽至 7%
    max_price_increase: 0.25
    max_price_drop: 0.20
  
  # ========== 数据完整性要求（大幅降低） ==========
  data_requirements:
    min_klines:
      1d: 20    # 从 55 降至 20
      4h: 50    # 从 200 降至 50
      1h: 100   # 从 800 降至 100
    low_confidence_factor: 0.8  # 数据缺失时得分打折
  
  # ========== 仓位系数配置 ==========
  position_ratio:
    base: 0.3
    max: 0.6
    coefficient: 0.3
  
  # ========== 评分参数 ==========
  parameters:
    ema_slope:
      periods: 5
      strong_threshold: 0.0008
      medium_threshold: 0.0004
    
    breakthrough:
      lookback_periods: 20
      volume_ratio_threshold: 1.3
    
    rsi:
      healthy_min: 30
      healthy_max: 70
      extreme_min: 20
      extreme_max: 80
    
    macd:
      golden_cross_score: 6
      zero_cross_score: 2
      expanding_score: 2
      accelerating_score: 2

# ========== 币种特定配置 ==========
symbols:
  BTCUSDT:
    high_volatility_threshold: 0.04
    break_through_pct: 0.015
  
  ETHUSDT:
    high_volatility_threshold: 0.045
    break_through_pct: 0.015
  
  BNBUSDT:
    high_volatility_threshold: 0.07
    break_through_pct: 0.025

# ========== 动态校准配置 ==========
dynamic_calibration:
  enabled: true
  min_s_grade_signals: 50     # 6 个月内最少 S 级信号数
  calibration_window: 180     # 回测窗口（天）
  win_rate_threshold: 0.30    # 连续 20 笔胜率低于此值触发校准
  adjustment_step: 5          # 权重调整步长
