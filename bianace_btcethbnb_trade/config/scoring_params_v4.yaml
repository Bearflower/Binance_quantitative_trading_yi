# v4 评分系统配置参数

scoring:
  # 6 维度权重配置
  dimensions:
    trend_strength:
      weight: 0.20
      max_score: 20
      description: "趋势强度（EMA 排列、ADX、趋势持续性）"
    
    trend_consistency:
      weight: 0.15
      max_score: 15
      description: "趋势一致性（多时间框架 EMA 方向）"
    
    pattern_quality:
      weight: 0.20
      max_score: 20
      description: "形态质量（突破、K 线形态、支撑阻力）"
    
    volume_confirmation:
      weight: 0.15
      max_score: 15
      description: "成交量确认（量比）"
    
    momentum_divergence:
      weight: 0.15
      max_score: 15
      description: "动量背离（RSI、MACD）"
    
    risk_premium:
      weight: 0.15
      max_score: 15
      description: "风险溢价（波动率调整）"
  
  # 等级阈值（动态排序 + 绝对阈值）
  grade_thresholds:
    S: 0.85  # 前 15%
    A: 0.70  # 前 30%
    B: 0.50  # 前 50%
    C: 0.30  # 前 70%
  
  # 一票否决
  veto:
    max_funding_rate: 0.0008  # 资金费率>0.08%
    max_volatility: 0.06      # 波动率>6%
    max_price_increase: 0.15  # 24h 涨幅>15%
    max_price_drop: 0.20      # 24h 跌幅>20%
  
  # 市场状态过滤
  market_filter:
    min_adx: 25               # ADX<25 为震荡市
    min_bollinger_width: 0.05 # 布林带宽度<5% 为震荡市
  
  # 盈亏比要求
  risk_reward:
    min_ratio: 2.0            # 最低盈亏比 2:1
    default_stop_atr: 1.5     # 止损 1.5x ATR
    default_target_atr_1: 4.0 # 止盈 1: 4x ATR
    default_target_atr_2: 6.0 # 止盈 2: 6x ATR

# 交易参数
trading:
  # 频率控制
  frequency:
    max_trades_per_day: 3     # 每日最多 3 笔
    cooldown_hours: 24        # 同币种冷却 24 小时
  
  # 仓位管理
  position:
    base_ratio: 0.1           # 基础仓位 10%
    max_ratio: 0.5            # 最大仓位 50%
  
  # 手续费
  fee:
    maker: 0.0002             # 挂单 0.02%
    taker: 0.0004             # 吃单 0.04%
    assumed_maker_ratio: 0.5  # 假设 50% 挂单成交

# 币种特定配置
symbols:
  BTCUSDT:
    volatility_multiplier: 1.0
  ETHUSDT:
    volatility_multiplier: 1.2
  BNBUSDT:
    volatility_multiplier: 1.3
