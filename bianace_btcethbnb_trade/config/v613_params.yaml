# v6.13 动态仓位调整配置参数
# 版本：v6.13
# 更新日期：2026-04-10
# 说明：根据账户可用保证金动态调整仓位大小

# ==================== 动态仓位调整器配置 ====================

position_adjuster:
  # 安全垫比例
  # 说明：只使用可用余额的 safety_ratio 比例，保留 (1 - safety_ratio) 作为安全垫
  # 示例：可用余额 100U，safety_ratio=0.8，则最多使用 80U
  # 推荐值：0.7-0.9，保守型用 0.7，激进型用 0.9
  safety_ratio: 0.8
  
  # 最小保证金阈值（USDT）
  # 说明：调整后保证金低于此值时，直接跳过交易（不执行）
  # 原因：过小的仓位会导致手续费占比过高，不划算
  # 推荐值：5-10U（根据账户规模调整）
  min_position_margin: 5
  
  # 最大保证金限制（USDT）
  # 说明：单仓最大保证金，防止过度杠杆
  # 推荐值：50-100U（500U 账户建议 100U）
  max_position_margin: 100

# ==================== 使用示例 ====================

# 场景 1：资金充足
# 可用余额：100U
# 预设保证金：14U
# 可用保证金：100 × 0.8 = 80U
# 结果：80U >= 14U，不调整，全额执行

# 场景 2：资金略不足
# 可用余额：12U
# 预设保证金：14U
# 可用保证金：12 × 0.8 = 9.6U
# 调整系数：9.6 / 14 = 0.686 (68.6%)
# 调整后保证金：14 × 0.686 = 9.6U
# 结果：9.6U >= 5U（最小阈值），执行，仓位降至 68.6%

# 场景 3：资金严重不足
# 可用余额：6U
# 预设保证金：14U
# 可用保证金：6 × 0.8 = 4.8U
# 调整系数：4.8 / 14 = 0.343 (34.3%)
# 调整后保证金：14 × 0.343 = 4.8U
# 结果：4.8U < 5U（最小阈值），跳过交易

# ==================== 调整逻辑流程图 ====================

# 开始
#   ↓
# 计算可用保证金 = 可用余额 × 0.8
#   ↓
# 可用保证金 >= 预设保证金？
#   ├─ 是 → 不调整，全额执行
#   └─ 否 → 计算调整系数
#         ↓
#       调整系数 = 可用保证金 / 预设保证金
#       调整后保证金 = 预设保证金 × 调整系数
#         ↓
#       调整后保证金 >= 最小阈值 (5U)？
#         ├─ 是 → 等比缩放仓位，执行交易
#         └─ 否 → 跳过交易

# ==================== 与其他版本的差异 ====================

# v6.12：固定仓位
# - 根据信号等级固定仓位系数（S 级 50%、A 级 30% 等）
# - 保证金不足时直接跳过交易
# - 优点：风险可控，严格执行规则
# - 缺点：可能错过交易机会

# v6.13：动态仓位
# - 在 v6.12 基础上，根据可用保证金动态调整
# - 保证金不足时自动降仓，而不是直接放弃
# - 优点：充分利用资金，不错过任何机会
# - 缺点：仓位可能过小，手续费占比提高

# 建议：
# - 500U 账户：使用 v6.13，最小阈值 5U
# - 1000U+ 账户：使用 v6.12 或 v6.13（最小阈值 10U）
# - 200U 以下账户：使用 v6.13，最小阈值 3U
